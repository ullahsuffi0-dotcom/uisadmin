<script>
'use strict';
const DB={_pfx:'sms7_',get(k){try{return JSON.parse(localStorage.getItem(this._pfx+k)||'null')}catch{return null}},set(k,v){localStorage.setItem(this._pfx+k,JSON.stringify(v))},del(k){localStorage.removeItem(this._pfx+k)}};

// ═══════════════════════════════════════════════════════════
// PASSWORD HASHING — SHA-256 via Web Crypto API
// ═══════════════════════════════════════════════════════════
async function hashPassword(pw){
  const enc=new TextEncoder().encode(pw);
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ═══════════════════════════════════════════════════════════
// MULTI-SCHOOL / MULTI-TENANCY LAYER
// Platform-level data uses raw localStorage with 'sms7_' prefix (never school-scoped).
// School-level data uses DB with dynamic _pfx (sms7_sch_SCHOOLID_).
// ═══════════════════════════════════════════════════════════
let CURRENT_SCHOOL_ID=null;
let PLATFORM_MODE=false;

  localStorage.setItem('sms7_platform_schools',JSON.stringify(list));

}

// Sync platform data to Firebase so it works across devices
function syncPlatformToFirebase(key,value){
  if(!window.__FB||!window.__FB.db)return;
  try{
    const{db,ref,set}=window.__FB;
    set(ref(db,'platform/'+key),value).catch(e=>console.warn('[Platform sync] Write failed:',e.message));
  }catch(e){}
}

// Pull platform data from Firebase on boot (before initPlatform)
async function syncPlatformFromFirebase(){
  if(!window.__FB||!window.__FB.db)return false;
  try{
    const{db,ref,get}=window.__FB;
    const snap=await get(ref(db,'platform'));
    if(snap.exists()){
      const data=snap.val();
      // Always overwrite local with Firebase truth — clear stale local data
      if(data.platform_schools){
        localStorage.setItem('sms7_platform_schools',JSON.stringify(data.platform_schools));
      }else{
        // Firebase has no schools — clear any stale local schools
        localStorage.setItem('sms7_platform_schools',JSON.stringify([]));
      }
      if(data.platform_admins){
        localStorage.setItem('sms7_platform_admins',JSON.stringify(data.platform_admins));
        localStorage.setItem('sms7_platform_initialized','true');
      }
      return true;
    }
    return false;
  }catch(e){console.warn('[Platform sync] Pull failed:',e.message);return false;}
}

// Subscribe to live platform changes from other devices
function subscribePlatformSync(){
  if(!window.__FB||!window.__FB.db)return;
  const{db,ref,onValue}=window.__FB;
  ['platform_schools','platform_admins'].forEach(key=>{
    onValue(ref(db,'platform/'+key),(snap)=>{
      const v=snap.val();
      // If Firebase value is null (deleted), clear local data too
      localStorage.setItem('sms7_'+key,JSON.stringify(v||[]));
      // Refresh school dropdown if schools changed
      if(key==='platform_schools'&&typeof populateSchoolDropdown==='function'){
        try{populateSchoolDropdown();}catch(e){}
      }
    });
  });
}

async function initPlatform(){
  const admins=getPlatformAdmins();
  // Fix any admin with missing passwordHash (race condition recovery)
  if(admins.length>0&&!admins[0].passwordHash){
    admins[0].passwordHash=await hashPassword('Platform@2024');
    setPlatformAdmins(admins);
  }
  if(localStorage.getItem('sms7_platform_initialized'))return;
  const h=await hashPassword('Platform@2024');
  const defaultAdmins=[{
    id:'pa1',username:'platformadmin',passwordHash:h,
    firstName:'Platform',lastName:'Admin',
    email:'admin@platform.com',active:true,
    created:new Date().toISOString().split('T')[0]
  }];
  localStorage.setItem('sms7_platform_admins',JSON.stringify(defaultAdmins));
  syncPlatformToFirebase('platform_admins',defaultAdmins);
  localStorage.setItem('sms7_platform_schools',JSON.stringify([]));
  syncPlatformToFirebase('platform_schools',[]);
  localStorage.setItem('sms7_platform_initialized','true');
}

async function migrateExistingDataToSchool(schoolId){
  const oldPfx='sms7_';
  const newPfx='sms7_sch_'+schoolId+'_';
  const keys=['sv7','settings','accounts','students','teachers','complaints','tasks','infractions',
    'referrals','class_visits','notebook_checks','activities','activity_reports',
    'early_pickups','announcements','discipline_reports','activity_log','infraction_forms',
    'visit_forms','task_requests','exam_absents','exam_sessions','academic_calendar','attendance',
    'student_health','remedial_plans','vp_reports','warning_letters','teacher_achievements',
    'reexam_schedules','sessions','active_session_id','behaviour'];
  let migrated=0;
  for(let i=0;i<localStorage.length;i++){
    const lk=localStorage.key(i);
    if(!lk||!lk.startsWith(oldPfx))continue;
    const k=lk.substring(oldPfx.length);
    if(k.startsWith('platform_')||k.startsWith('sch_'))continue;
    const matchesBase=keys.some(bk=>k===bk||k.startsWith(bk+'_'));
    if(matchesBase){
      const val=localStorage.getItem(lk);
      if(val&&!localStorage.getItem(newPfx+k)){
        localStorage.setItem(newPfx+k,val);
        migrated++;
      }
    }
  }
  const acc=JSON.parse(localStorage.getItem(newPfx+'accounts')||'[]');
  for(const a of acc){
    if(a.password&&!a.passwordHash){
      a.passwordHash=await hashPassword(a.password);
      delete a.password;
    }
  }
  localStorage.setItem(newPfx+'accounts',JSON.stringify(acc));
  return migrated;
}

  const city=document.getElementById('ns-city').value.trim();
  const logo=document.getElementById('ns-logo').value.trim()||'🎓';

  const afn=document.getElementById('ns-afn').value.trim();
  const aln=document.getElementById('ns-aln').value.trim();
  const aun=document.getElementById('ns-aun').value.trim().toLowerCase().replace(/\s/g,'');

  const aem=document.getElementById('ns-aem').value.trim();
  if(!name||!city||!afn||!aln||!aun||!apw){toast('Fill all required fields','danger');return;}
  if(apw.length<8){toast('Password must be 8+ characters','danger');return;}
  const schoolId='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const schools=getPlatformSchools();
  schools.push({id:schoolId,name,nameAr,city,logo,academicYear:year,active:true,created:new Date().toISOString().split('T')[0]});
  setPlatformSchools(schools);
  const ph=await hashPassword(apw);
  const defPh=await hashPassword('Admin@2024');
  const pfx='sms7_sch_'+schoolId+'_';
  const today=new Date().toISOString().split('T')[0];
  localStorage.setItem(pfx+'settings',JSON.stringify({schoolName:name,schoolNameAr:nameAr,city,academicYear:year,logo}));
  // Create default admin staff accounts for all roles
  const ts=Date.now();
  const defaultAccounts=[
    {id:'u'+ts+'sa',username:aun,passwordHash:ph,role:'superadmin',firstName:afn,lastName:aln,email:aem,phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'pr',username:'principal',passwordHash:defPh,role:'principal',firstName:'Principal',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'vp',username:'vice_principal',passwordHash:defPh,role:'vice_principal',firstName:'Vice Principal',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'as',username:'academic_supervisor',passwordHash:defPh,role:'academic_supervisor',firstName:'Academic Supervisor',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'sv',username:'student_advisor',passwordHash:defPh,role:'student_advisor',firstName:'Student Advisor',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'ai',username:'activity_incharge',passwordHash:defPh,role:'activity_incharge',firstName:'Activity Incharge',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'qs',username:'quality_supervisor',passwordHash:defPh,role:'quality_supervisor',firstName:'Quality Supervisor',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'qi',username:'quality_incharge',passwordHash:defPh,role:'quality_incharge',firstName:'Quality Incharge',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today},
    {id:'u'+ts+'aa',username:'admin_assistant',passwordHash:defPh,role:'admin_assistant',firstName:'Admin Assistant',lastName:name,email:'',phone:'',active:true,theme:'blue',lang:'en',created:today}
  ];
  localStorage.setItem(pfx+'accounts',JSON.stringify(defaultAccounts));
  const emptyCollections=['students','teachers','complaints','tasks','infractions','referrals',
    'class_visits','notebook_checks','activities','activity_reports','early_pickups',
    'announcements','discipline_reports','activity_log','infraction_forms','visit_forms',
    'task_requests','exam_absents','academic_calendar','attendance','student_health',
    'remedial_plans','vp_reports','warning_letters','teacher_achievements','reexam_schedules'];
  emptyCollections.forEach(k=>localStorage.setItem(pfx+k,JSON.stringify([])));
  localStorage.setItem(pfx+'sv7','true');
  localStorage.setItem(pfx+'sessions',JSON.stringify([{id:'default',name:'Default Session',startDate:new Date().toISOString().split('T')[0],endDate:new Date(Date.now()+365*86400000).toISOString().split('T')[0],created:new Date().toISOString(),createdBy:'system',isActive:true}]));
  localStorage.setItem(pfx+'active_session_id',JSON.stringify('default'));
  emptyCollections.forEach(k=>{
    if(!['activity_log','announcements','academic_calendar','infraction_forms','visit_forms'].includes(k))
      localStorage.setItem(pfx+k+'_default',JSON.stringify([]));
  });
  localStorage.setItem(pfx+'announcements_default',JSON.stringify([{id:'an1',title:'Welcome to '+name,body:'Your school has been set up. Start by adding teachers and students.',postedBy:afn+' '+aln,date:new Date().toISOString().split('T')[0]}]));

  if(window.__FB&&window.__FB.db){
    try{
      const{db,ref,set}=window.__FB;
      const fbPath='schools/'+schoolId+'/';
      const data={};
      for(let i=0;i<localStorage.length;i++){
        const lk=localStorage.key(i);

        const k=lk.substring(pfx.length);
        try{data[k]=JSON.parse(localStorage.getItem(lk));}catch(e){data[k]=localStorage.getItem(lk);}
      }
      set(ref(db,fbPath),data).catch(e=>console.error('[School Create] Firebase push failed:',e));
    }catch(e){console.error('[School Create] Firebase push error:',e);}
  }
  closeM();toast('School "'+name+'" created successfully!','success');
  rPlatformSchools();
}

function saveEditSchool(id){
  const schools=getPlatformSchools();
  const i=schools.findIndex(s=>s.id===id);if(i<0)return;
  schools[i].name=document.getElementById('es-name').value.trim()||schools[i].name;
  schools[i].nameAr=document.getElementById('es-namear').value.trim();
  schools[i].city=document.getElementById('es-city').value.trim();
  schools[i].logo=document.getElementById('es-logo').value.trim()||'🎓';
  schools[i].academicYear=document.getElementById('es-year').value.trim();
  setPlatformSchools(schools);
  const pfx='sms7_sch_'+id+'_';
  try{
    const settings=JSON.parse(localStorage.getItem(pfx+'settings')||'{}');
    settings.schoolName=schools[i].name;settings.schoolNameAr=schools[i].nameAr;
    settings.city=schools[i].city;settings.logo=schools[i].logo;settings.academicYear=schools[i].academicYear;
    localStorage.setItem(pfx+'settings',JSON.stringify(settings));
  }catch{}
  closeM();toast('Updated','success');rPlatformSchools();
}

function toggleSchool(id){
  const schools=getPlatformSchools();
  const i=schools.findIndex(s=>s.id===id);if(i<0)return;
  schools[i].active=schools[i].active===false?true:false;
  setPlatformSchools(schools);
  toast('School '+(schools[i].active?'enabled':'disabled'),'success');
  rPlatformSchools();
}

async function enterSchool(id){
  selectSchool(id);
  if(typeof resyncForSchool==='function')await resyncForSchool();
  const sch=getSchoolById(id);
  if(!sch)return;
  const acc=DB.get('accounts')||[];
  const sa=acc.find(a=>a.role==='superadmin'&&a.active);
  if(sa){
    CU={...sa,_platformReturn:true};SAIMP=false;SAR=null;
    PLATFORM_MODE=false;
    if(typeof initSessions==='function')initSessions();
    launch();
    toast('Entered '+sch.name+' as '+sa.firstName,'info');
  }else{
    toast('No superadmin account found for this school','danger');
    deselectSchool();
  }
}

function returnToPlatform(){
  deselectSchool();
  PLATFORM_MODE=true;
  const admins=getPlatformAdmins();
  CU={...admins[0],role:'platform_admin',_origRole:'platform_admin'};
  launchPlatform();
}

async function doMigrateExisting(){
  const name=document.getElementById('mig-name').value.trim();
  const city=document.getElementById('mig-city').value.trim();
  const logo=document.getElementById('mig-logo').value.trim()||'🎓';
  if(!name||!city){toast('Fill required fields','danger');return;}
  const schoolId='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const schools=getPlatformSchools();
  const oldSettings=JSON.parse(localStorage.getItem('sms7_settings')||'{}');
  schools.push({id:schoolId,name:name||oldSettings.schoolName||'School',nameAr:oldSettings.schoolNameAr||'',city:city||oldSettings.city||'',logo:logo||oldSettings.logo||'🎓',academicYear:oldSettings.academicYear||'',active:true,created:new Date().toISOString().split('T')[0]});
  setPlatformSchools(schools);
  const count=await migrateExistingDataToSchool(schoolId);
  closeM();toast('Migrated '+count+' data entries to "'+name+'"','success');
  rPlatformSchools();
}

async function savePlatformAdmin(){
  const fn=document.getElementById('npa-fn').value.trim(),ln=document.getElementById('npa-ln').value.trim();
  const un=document.getElementById('npa-un').value.trim().toLowerCase().replace(/\s/g,'');
  const pw=document.getElementById('npa-pw').value,em=document.getElementById('npa-em').value.trim();
  if(!fn||!ln||!un||!pw){toast('Fill required fields','danger');return;}
  if(pw.length<8){toast('Password must be 8+ characters','danger');return;}
  const admins=getPlatformAdmins();
  if(admins.find(a=>a.username===un)){toast('Username exists','danger');return;}
  const ph=await hashPassword(pw);
  admins.push({id:'pa'+Date.now(),username:un,passwordHash:ph,firstName:fn,lastName:ln,email:em,active:true,created:new Date().toISOString().split('T')[0]});
  setPlatformAdmins(admins);
  closeM();toast('Platform admin created','success');rPlatformAdmins();
}

function editPlatformAdminM(id){
  const admins=getPlatformAdmins();
  const a=admins.find(x=>x.id===id);if(!a)return;
  openM('<div class="mh"><h3>Edit: '+esc(a.firstName)+' '+esc(a.lastName)+'</h3><button class="mc" onclick="closeM()">×</button></div>'
    +'<div class="mb2">'
    +'<div class="fr f2"><div class="fg"><label>First Name</label><input id="epa-fn" value="'+esc(a.firstName)+'"></div>'
    +'<div class="fg"><label>Last Name</label><input id="epa-ln" value="'+esc(a.lastName)+'"></div></div>'
    +'<div class="fg"><label>Email</label><input id="epa-em" value="'+esc(a.email||'')+'"></div>'
    +'<div class="fg"><label>New Password (blank = keep current)</label><input id="epa-pw" type="password"></div>'
    +'</div><div class="mf"><button class="btn bg2" onclick="closeM()">Cancel</button>'
    +'<button class="btn bp" onclick="saveEditPlatformAdmin(\''+id+'\')">Save →</button></div>');
}

async function saveEditPlatformAdmin(id){
  const admins=getPlatformAdmins();
  const i=admins.findIndex(a=>a.id===id);if(i<0)return;
  admins[i].firstName=document.getElementById('epa-fn').value.trim()||admins[i].firstName;
  admins[i].lastName=document.getElementById('epa-ln').value.trim()||admins[i].lastName;
  admins[i].email=document.getElementById('epa-em').value.trim();
  const np=document.getElementById('epa-pw').value;
  if(np&&np.length>=8)admins[i].passwordHash=await hashPassword(np);
  setPlatformAdmins(admins);
  closeM();toast('Updated','success');rPlatformAdmins();
}

  if(!DB.get('exam_sessions')){const abs=DB.get('exam_absents')||[];const names=[...new Set(abs.map(a=>a.examSession).filter(Boolean))];if(names.length){DB.set('exam_sessions',names.map(n=>({id:nid('es'),name:n,status:'active',createdBy:'System (migrated)',created:new Date().toISOString().split('T')[0]})));}else{DB.set('exam_sessions',[]);}}
  // Update school name from old default if still unchanged
  const s=DB.get('settings')||{};
  if(s.schoolName==='Al-Noor International School'){s.schoolName='UNAIZAH INTERNATIONAL SCHOOL';s.schoolNameAr='مدرسة عنيزة العالمية';s.city='Unaizah';DB.set('settings',s);}
  if(!DB.get('teachers'))DB.set('teachers',[
    {id:'tch1',name:'Mohammed Al-Saadi',employeeId:'T-1042',subject:'Mathematics',department:'Science',phone:'0501112233',email:'m.alsaadi@school.sa',note:'',active:true,created:new Date().toISOString().split('T')[0]},

  const acc=DB.get('accounts')||[];
  const oldNames={u1:'Mohammed Al-Rashidi',u2:'Ahmed Al-Otaibi',u3:'Fatima Al-Zahrani',u4:'Sara Al-Ghamdi',u5:'Khalid Al-Dossari',u6:'Faisal Al-Harbi',u7:'Omar Al-Mutairi',u8:'Nora Al-Shehri',u9:'Hassan Al-Subaie'};
  const newNames={u1:{f:'System',l:'Administrator'},u2:{f:'Hamza',l:'Alhalaly'},u3:{f:'Suffi',l:'Ullah',scope:'Primary'},u4:{f:'Zain',l:'Ul Arfeen'},u5:{f:'Abdulmonim',l:''},u6:{f:'ABC',l:''},u7:{f:'Activity',l:'Incharge'},u8:{f:'Admin',l:'Assistant'},u9:{f:'Ahmed',l:'Alhatlani'}};
  let modified=false;
  Object.entries(oldNames).forEach(([id,oldName])=>{const i=acc.findIndex(a=>a.id===id);if(i>=0&&((acc[i].firstName+' '+acc[i].lastName).trim()===oldName)){acc[i].firstName=newNames[id].f;acc[i].lastName=newNames[id].l;if(newNames[id].scope)acc[i].scope=newNames[id].scope;modified=true;}});
  // Add second VP if missing (Abdulbasit)
  if(!acc.find(a=>a.id==='u3b')){acc.push({id:'u3b',username:'vice2',password:'admin123',role:'vice_principal',firstName:'Abdulbasit',lastName:'',email:'v.middle@school.sa',phone:'0500000010',active:true,created:'2024-01-01',theme:'teal',lang:'en',scope:'Middle & Secondary'});modified=true;}
  // Hash any remaining plaintext passwords
  let needsHash=false;
  acc.forEach(a=>{if(a.password&&!a.passwordHash)needsHash=true;});
  if(needsHash){Promise.all(acc.map(async a=>{if(a.password&&!a.passwordHash){a.passwordHash=await hashPassword(a.password);delete a.password;}})).then(()=>DB.set('accounts',acc));}
  if(modified)DB.set('accounts',acc);
  // Cleanup orphaned teacher accounts: accounts with role='teacher' whose teacher record no longer exists
  cleanupOrphanedTeacherAccounts();
}
function cleanupOrphanedTeacherAccounts(){
  const teachers=DB.get('teachers')||[];
  const accounts=DB.get('accounts')||[];
  if(!accounts.length)return;
  const tchIds=new Set(teachers.map(t=>t.id));
  const tchNames=new Set(teachers.map(t=>(t.name||'').trim().toLowerCase()).filter(Boolean));
  const orphans=accounts.filter(a=>{
    if(a.role!=='teacher')return false;
    // If linked by teacherId, check if teacher still exists
    if(a.teacherId)return !tchIds.has(a.teacherId);
    // If no teacherId, match by name
    const accName=((a.firstName||'')+' '+(a.lastName||'')).trim().toLowerCase();
    if(!accName)return false;
    return !tchNames.has(accName);
  });
  if(orphans.length){
    const cleaned=accounts.filter(a=>!orphans.find(o=>o.id===a.id));
    DB.set('accounts',cleaned);
    console.log('[Migrate] Removed '+orphans.length+' orphaned teacher account(s): '+orphans.map(a=>a.username).join(', '));
  }
}

async function doLogin(){
  if(Date.now()<_loginLockUntil){
    const secs=Math.ceil((_loginLockUntil-Date.now())/1000);
    showLoginError('Too many attempts. Wait '+secs+'s.');
    return;
  }
  const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp2').value.trim();
  const schoolVal=document.getElementById('lsch').value;
  if(!u||!p){showLoginError('Enter username and password');return;}
  if(!schoolVal){showLoginError('Select a school first');return;}

  if(schoolVal==='__platform'){
    const admins=getPlatformAdmins();
    const ph=await hashPassword(p);
    const admin=admins.find(a=>a.username===u&&a.passwordHash===ph&&a.active);
    if(!admin){
      _loginAttempts++;
      if(_loginAttempts>=5){_loginLockUntil=Date.now()+30000;_loginAttempts=0;}
      showLoginError('Invalid platform admin credentials');
      return;
    }
    _loginAttempts=0;
    CU={...admin,role:'platform_admin',_origRole:'platform_admin'};
    PLATFORM_MODE=true;CURRENT_SCHOOL_ID=null;SAIMP=false;SAR=null;
    // Persist login session
    localStorage.setItem('sms7_session',JSON.stringify({userId:admin.id,school:'__platform'}));
    launchPlatform();
    return;
  }

  selectSchool(schoolVal);
  // Re-sync from Firebase for this school's data path
  if(typeof resyncForSchool==='function')await resyncForSchool();
  const acc=DB.get('accounts')||[];
  const ph=await hashPassword(p);
  let user=acc.find(a=>a.username===u&&a.passwordHash===ph&&a.active);
  if(!user){
    user=acc.find(a=>a.username===u&&a.password===p&&a.active);
    if(user){
      user.passwordHash=ph;
      delete user.password;
      DB.set('accounts',acc);
    }
  }
  if(!user){
    _loginAttempts++;
    if(_loginAttempts>=5){_loginLockUntil=Date.now()+30000;_loginAttempts=0;showLoginError('Too many attempts. Locked for 30 seconds.');}
    else showLoginError('Invalid credentials ('+_loginAttempts+'/5)');
    document.getElementById('login-attempts').style.display='block';
    document.getElementById('login-attempts').textContent='Attempt '+_loginAttempts+' of 5';
    return;
  }
  _loginAttempts=0;
  document.getElementById('login-attempts').style.display='none';
  CU=user;SAIMP=false;SAR=null;
  // Persist login session
  localStorage.setItem('sms7_session',JSON.stringify({userId:user.id,school:schoolVal}));
  launch();
}

async function verifyResetEmail(){
  const sch=document.getElementById('rst-sch').value;
  const user=document.getElementById('rst-user').value.trim().toLowerCase();
  const email=document.getElementById('rst-email').value.trim().toLowerCase();
  const errEl=document.getElementById('rst-err');
  errEl.style.display='none';

  if(!sch||!user||!email){
    errEl.textContent='Please fill all fields and select a school.';errEl.style.display='block';return;
  }

  let account=null;
  if(sch==='__platform'){
    // Platform admin reset
    const admins=getPlatformAdmins();
    account=admins.find(a=>a.username===user&&(a.email||'').toLowerCase()===email&&a.active);
    if(!account){errEl.textContent='No matching platform admin found. Check username and email.';errEl.style.display='block';return;}
    // Show step 2
    document.getElementById('rst-step2').style.display='block';
    document.getElementById('rst-btn').textContent='Reset Password →';
    document.getElementById('rst-btn').setAttribute('onclick','doResetPassword()');
    window.__resetTarget={type:'platform',username:user,email:email};
  }else{
    // School account reset — need to load school data from Firebase
    const oldPfx=DB._pfx;
    DB._pfx='sms7_sch_'+sch+'_';
    // Try to sync from Firebase first
    if(window.__FB&&window.__FB.db){
      try{
        const{db,ref,get}=window.__FB;
        const snap=await get(ref(db,'schools/'+sch+'/accounts'));
        if(snap.exists()){
          localStorage.setItem(DB._pfx+'accounts',JSON.stringify(snap.val()));
        }
      }catch(e){console.warn('Reset: Firebase fetch failed',e);}
    }
    const acc=JSON.parse(localStorage.getItem(DB._pfx+'accounts')||'[]');
    account=acc.find(a=>a.username===user&&(a.email||'').toLowerCase()===email&&a.active);
    DB._pfx=oldPfx;
    if(!account){errEl.textContent='No matching account found. Make sure your email is linked to your account and check your username.';errEl.style.display='block';return;}
    // Show step 2
    document.getElementById('rst-step2').style.display='block';
    document.getElementById('rst-btn').textContent='Reset Password →';
    document.getElementById('rst-btn').setAttribute('onclick','doResetPassword()');
    window.__resetTarget={type:'school',schoolId:sch,username:user,email:email};
  }
}

async function doResetPassword(){
  const nw=document.getElementById('rst-newpw').value;
  const cf=document.getElementById('rst-cfpw').value;
  const errEl=document.getElementById('rst-err');
  errEl.style.display='none';

  if(!nw||!cf){errEl.textContent='Enter and confirm your new password.';errEl.style.display='block';return;}
  if(nw.length<6){errEl.textContent='Password must be at least 6 characters.';errEl.style.display='block';return;}
  if(nw!==cf){errEl.textContent='Passwords do not match.';errEl.style.display='block';return;}

  const target=window.__resetTarget;
  if(!target){errEl.textContent='Session expired. Please start over.';errEl.style.display='block';return;}

  const newHash=await hashPassword(nw);

  if(target.type==='platform'){
    const admins=getPlatformAdmins();
    const i=admins.findIndex(a=>a.username===target.username&&(a.email||'').toLowerCase()===target.email);
    if(i<0){errEl.textContent='Account not found. Please start over.';errEl.style.display='block';return;}
    admins[i].passwordHash=newHash;
    delete admins[i].password;
    localStorage.setItem('sms7_platform_admins',JSON.stringify(admins));
    syncPlatformToFirebase('platform_admins',admins);
    closeM();
    toast('Password reset successfully! You can now log in.','success');
  }else{
    const pfx='sms7_sch_'+target.schoolId+'_';
    const acc=JSON.parse(localStorage.getItem(pfx+'accounts')||'[]');
    const i=acc.findIndex(a=>a.username===target.username&&(a.email||'').toLowerCase()===target.email);
    if(i<0){errEl.textContent='Account not found. Please start over.';errEl.style.display='block';return;}
    acc[i].passwordHash=newHash;
    delete acc[i].password;
    localStorage.setItem(pfx+'accounts',JSON.stringify(acc));
    // Push to Firebase
    if(window.__FB&&window.__FB.db){
      try{
        const{db,ref,set}=window.__FB;
        set(ref(db,'schools/'+target.schoolId+'/accounts'),acc).catch(e=>console.warn('Reset push failed:',e));
      }catch(e){}
    }
    closeM();
    toast('Password reset successfully! You can now log in with your new password.','success');
  }
  window.__resetTarget=null;
}

function saveProf(){const fn=document.getElementById('pfn').value.trim(),ln=document.getElementById('pln').value.trim();if(!fn||!ln){toast('Name required','danger');return;}const acc=DB.get('accounts')||[];const i=acc.findIndex(a=>a.id===CU.id);if(i<0)return;const oldFullName=((acc[i].firstName||'')+' '+(acc[i].lastName||'')).trim().toLowerCase();acc[i].firstName=fn;acc[i].lastName=ln;acc[i].email=document.getElementById('pem').value.trim();acc[i].phone=document.getElementById('pph').value.trim();DB.set('accounts',acc);CU.firstName=fn;CU.lastName=ln;CU.email=acc[i].email;CU.phone=acc[i].phone;document.getElementById('sbun').textContent=fn+' '+ln;document.getElementById('sbav').textContent=((fn[0]||'')+(ln[0]||'')).toUpperCase();/* If teacher, also update the linked teacher record */if((CU._origRole||CU.role)==='teacher'){const teachers=DB.get('teachers')||[];const newFullName=(fn+' '+ln).trim();let tchIdx=teachers.findIndex(t=>((t.firstName||'')+' '+(t.lastName||'')).trim().toLowerCase()===oldFullName);if(tchIdx<0)tchIdx=teachers.findIndex(t=>(t.name||'').trim().toLowerCase()===oldFullName);/* Also handle subject input if present */const subjEl=document.getElementById('p-subject');if(tchIdx>=0){teachers[tchIdx].firstName=fn;teachers[tchIdx].lastName=ln;teachers[tchIdx].name=newFullName;teachers[tchIdx].phone=acc[i].phone;teachers[tchIdx].email=acc[i].email;if(subjEl)teachers[tchIdx].subject=subjEl.value.trim();DB.set('teachers',teachers);}else if(subjEl&&subjEl.value.trim()){/* No existing teacher record — create one */teachers.push({id:'tch'+Date.now(),name:newFullName,firstName:fn,lastName:ln,subject:subjEl.value.trim(),phone:acc[i].phone,email:acc[i].email,active:true,created:new Date().toISOString().split('T')[0]});DB.set('teachers',teachers);}}logA('Updated profile');toast(T('save_profile')+' ✓','success');rProfile();}

function saveLinkGmail(id){
  const email=document.getElementById('lg-email').value.trim();
  if(!email){toast('Enter a Gmail/email address','danger');return;}
  if(!email.includes('@')){toast('Enter a valid email address','danger');return;}
  const acc=DB.get('accounts')||[];
  const i=acc.findIndex(a=>a.id===id);
  if(i<0){toast('Account not found','danger');return;}
  acc[i].email=email;
  DB.set('accounts',acc);

function vCmp(id){const complaints=DB.get('complaints')||[];const c=complaints.find(x=>x.id===id);if(!c)return;const isQI=CU.role==='quality_incharge';const canA=!isQI&&['superadmin','principal','vice_principal','academic_supervisor'].includes(CU.role);const canR=!isQI&&(canA||c.assignedTo===CU.id);const canAck=!isQI&&['superadmin','principal'].includes(CU.role);openM('<div class="mh"><h3>'+c.trackNo+' — '+c.type+'</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2">'+(isQI?'<div class="al ai">👁️ Read-only view (Quality Incharge)</div>':'')+'<div style="display:flex;gap:5px;margin-bottom:12px"><span class="badge '+(c.status==='Open'?'brd':c.status==='In Progress'?'bbl':c.status==='Resolved'?'bgn':'bgr')+'">'+c.status+'</span><span class="badge '+(c.priority==='High'?'brd':c.priority==='Medium'?'bgo':'bgn')+'">'+c.priority+'</span></div><div class="cg g2" style="margin-bottom:12px;font-size:12px"><div><div style="font-size:10px;color:var(--tx3)">'+T('parent_name')+'</div><div style="font-weight:600">'+c.parentName+'</div><div class="mono" style="font-size:11px;color:var(--tx3)">'+c.parentPhone+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Student</div><div style="font-weight:600">'+c.studentName+'</div><div style="font-size:11px;color:var(--tx3)">Gr '+c.grade+'-'+c.section+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Issue</div><div style="font-weight:600">'+c.type+' → '+c.subtype+'</div></div><div><div style="font-size:10px;color:var(--tx3)">'+T('date')+'</div><div style="font-weight:600">'+(c.created||'').split('T')[0]+'</div></div>'+(isQI&&c.assignedName?'<div><div style="font-size:10px;color:var(--tx3)">Assigned To</div><div style="font-weight:600">'+c.assignedName+'</div></div>':'')+'</div><div class="fg"><label>'+T('description')+'</label><div style="background:var(--sf2);padding:10px;border-radius:var(--rs);font-size:12px;color:var(--tx2);line-height:1.6">'+c.description+'</div></div>'+(canA?'<div class="fr f2"><div class="fg"><label>'+T('assigned_to')+'</label><select id="ca"><option value="">Unassigned</option>'+sOpts()+'</select></div><div class="fg"><label>'+T('status')+'</label><select id="cs">'+['Open','In Progress','Resolved','Closed'].map(s=>'<option'+(c.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div></div>':'')+(canAck?'<div class="fg"><label>'+T('principal_ack')+'</label><input id="cpk" value="'+esc(c.principalAck||'')+'" placeholder="Ack note…"></div>':isQI&&c.principalAck?'<div class="al ag">🎯 Principal Ack: '+esc(c.principalAck)+'</div>':'')+(canR?'<div class="fg"><label>'+T('add_remark')+'</label><textarea id="crm" placeholder="'+T('add_remark')+'…"></textarea></div>':'')+(c.remarks&&c.remarks.length?'<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--tx3);margin-bottom:8px">'+T('remark_history')+'</div><div class="tl2">'+c.remarks.map(r=>'<div class="tli"><div class="tld"></div><div class="tlm">'+new Date(r.time).toLocaleString()+' · '+r.by+'</div><div class="tlc">'+r.text+'</div></div>').join('')+'</div></div>':'')+'</div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('close')+'</button><button class="btn bg2 bsm" onclick="window.print()">🖨️</button>'+(isQI?'':'<button class="btn bp" onclick="saveCmp(\''+id+'\')">'+T('save')+' →</button>')+'</div>',true);const ae=document.getElementById('ca');if(ae&&c.assignedTo)ae.value=c.assignedTo;}
function saveCmp(id){const complaints=DB.get('complaints')||[];const i=complaints.findIndex(c=>c.id===id);if(i<0)return;const ae=document.getElementById('ca'),se=document.getElementById('cs'),re=document.getElementById('crm'),pe=document.getElementById('cpk');if(ae){const av=ae.value,u=av?gA(av):null;complaints[i].assignedTo=av||null;complaints[i].assignedName=u?u.firstName+' '+u.lastName:'';if(complaints[i].status==='Open'&&av)complaints[i].status='In Progress';}if(se)complaints[i].status=se.value;if(pe)complaints[i].principalAck=pe.value;if(re&&re.value.trim()){complaints[i].remarks=complaints[i].remarks||[];complaints[i].remarks.push({by:CU.firstName+' '+CU.lastName,role:rL(CU.role),text:re.value.trim(),time:new Date().toISOString()});logA('Updated complaint '+complaints[i].trackNo);}complaints[i].updated=new Date().toISOString();DB.set('complaints',complaints);closeM();toast('Updated','success');rComplaints();}

function asgTskM(){openM('<div class="mh"><h3>✅ Assign Task</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>Title *</label><input id="ntt"></div><div class="fg"><label>'+T('description')+' *</label><textarea id="ntd"></textarea></div><div class="fr f3"><div class="fg"><label>'+T('assigned_to')+' *</label><select id="nto"><option value="">— Select —</option>'+sOpts()+'</select></div><div class="fg"><label>'+T('priority')+'</label><select id="ntp"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="fg"><label>'+T('due_date')+' *</label><input type="date" id="ntdu"></div></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveTsk()">Submit →</button></div>');}
function saveTsk(){const title=document.getElementById('ntt').value.trim(),desc=document.getElementById('ntd').value.trim(),toId=document.getElementById('nto').value,due=document.getElementById('ntdu').value,pri=document.getElementById('ntp').value;if(!title||!desc||!toId||!due){toast('Fill required fields','danger');return;}const u=gA(toId),tasks=DB.get('tasks')||[];tasks.push({id:nid('t'),title,desc,assignedTo:toId,assignedName:u.firstName+' '+u.lastName,assignedBy:CU.id,assignedByName:CU.firstName+' '+CU.lastName,status:'Pending',priority:pri,progress:0,dueDate:due,taskType:'standard',remarks:[],created:new Date().toISOString().split('T')[0],updated:new Date().toISOString().split('T')[0]});DB.set('tasks',tasks);logA('Assigned task "'+title+'" to '+u.firstName+' '+u.lastName);closeM();toast('Task assigned','success');rTasks();}
function manTask(id){const tasks=DB.get('tasks')||[];const t=tasks.find(x=>x.id===id);if(!t)return;const isP=['superadmin','principal','quality_incharge'].includes(CU.role),isQI=CU.role==='quality_incharge',canE=!isQI&&(t.assignedTo===CU.id||t.assignedBy===CU.id||isP);openM('<div class="mh"><h3>'+t.title+'</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div style="display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap"><span class="badge '+(t.priority==='High'?'brd':t.priority==='Medium'?'bgo':'bgn')+'">'+t.priority+'</span><span class="badge '+(t.status==='Completed'?'bgn':t.status==='In Progress'?'bbl':'bgo')+'">'+t.status+'</span></div><div style="font-size:12px;color:var(--tx2);margin-bottom:12px;line-height:1.6">'+(t.desc||'')+'</div><div class="cg g3" style="margin-bottom:12px;font-size:11px"><div><div style="color:var(--tx3)">'+T('assigned_to')+'</div><div style="font-weight:600;margin-top:2px">'+t.assignedName+'</div></div><div><div style="color:var(--tx3)">'+T('assigned_by')+'</div><div style="font-weight:600;margin-top:2px">'+t.assignedByName+'</div></div><div><div style="color:var(--tx3)">'+T('due_date')+'</div><div style="font-weight:600;margin-top:2px">'+t.dueDate+'</div></div></div>'+(canE?'<div class="fr f2"><div class="fg"><label>'+T('status')+'</label><select id="tst">'+['Pending','In Progress','Completed'].map(s=>'<option'+(t.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="fg"><label>Progress %</label><input type="number" id="tpr" min="0" max="100" value="'+t.progress+'"></div></div><div class="fg"><label>'+T('add_remark')+'</label><textarea id="trm" placeholder="Update note…"></textarea></div>':'<div class="al ai">View only — not assigned to you.</div>')+(t.remarks&&t.remarks.length?'<div style="margin-top:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--tx3);margin-bottom:7px">'+T('remark_history')+'</div><div class="tl2">'+t.remarks.map(r=>'<div class="tli"><div class="tld"></div><div class="tlm">'+r.time+' · '+r.by+'</div><div class="tlc">'+r.text+'</div></div>').join('')+'</div></div>':'')+'</div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('close')+'</button><button class="btn bg2 bsm" onclick="window.print()">🖨️</button>'+(canE?'<button class="btn bp" onclick="saveTskUp(\''+id+'\')">'+T('save')+' →</button>':'')+'</div>');}
function saveTskUp(id){const tasks=DB.get('tasks')||[];const i=tasks.findIndex(t=>t.id===id);if(i<0)return;const st=document.getElementById('tst'),pr=document.getElementById('tpr'),rm=document.getElementById('trm');if(st)tasks[i].status=st.value;if(pr)tasks[i].progress=Math.min(100,Math.max(0,parseInt(pr.value)||0));if(rm&&rm.value.trim()){tasks[i].remarks=tasks[i].remarks||[];tasks[i].remarks.push({by:CU.firstName+' '+CU.lastName,text:rm.value.trim(),time:new Date().toLocaleString()});logA('Updated task "'+tasks[i].title+'"');}tasks[i].updated=new Date().toISOString().split('T')[0];DB.set('tasks',tasks);closeM();toast('Updated','success');rTasks();}
function rTaskReqs(){
  const reqs=DB.get('task_requests')||[];const canRecv=['vice_principal','academic_supervisor','superadmin','principal'].includes(CU.role);const mine=canRecv?reqs.filter(r=>r.requestedTo===CU.id):reqs.filter(r=>r.requestedBy===CU.id);const sb={Pending:'bgo',Accepted:'bbl',Assigned:'btl',Rejected:'brd',Completed:'bgn'};
  document.getElementById('pc').innerHTML='<div class="card" style="margin-bottom:12px"><div class="sh2"><h3>'+T('task_requests')+'</h3><button class="btn bp bsm" onclick="newTrM()">+ New</button></div></div>'+mine.map(r=>'<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1"><div style="display:flex;gap:5px;margin-bottom:4px;flex-wrap:wrap"><strong>'+r.title+'</strong><span class="badge '+(sb[r.status]||'bgr')+'">'+r.status+'</span><span class="badge bpu">'+r.priority+'</span></div><div style="font-size:11px;color:var(--tx3)">'+r.description+'</div><div style="font-size:11px;color:var(--tx3);margin-top:3px">'+(canRecv?'From: '+r.requestedByName:'To: '+r.requestedToName)+' · Needed: '+r.neededBy+'</div>'+(r.responseNote?'<div style="font-size:11px;color:var(--tl);margin-top:3px">Response: '+r.responseNote+'</div>':'')+(r.assignedToName?'<div style="font-size:11px;color:var(--su);margin-top:3px">✅ Assigned to: '+r.assignedToName+'</div>':'')+'</div>'+(canRecv&&r.status==='Pending'?'<button class="btn bp bsm" onclick="handleTR(\''+r.id+'\')">Respond</button>':'')+'</div></div>').join('')||'<div class="card"><div class="emp"><div class="ei">📨</div><p>'+T('no_records')+'</p></div></div>';
}
function newTrM(){openM('<div class="mh"><h3>📨 New Task Request</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>Title *</label><input id="trt"></div><div class="fg"><label>'+T('description')+' *</label><textarea id="trd"></textarea></div><div class="fr f3"><div class="fg"><label>Send To *</label><select id="trto"><option value="">— Select —</option>'+sOpts()+'</select></div><div class="fg"><label>'+T('priority')+'</label><select id="trp"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="fg"><label>Needed By *</label><input type="date" id="trdt"></div></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveTR()">Send →</button></div>');}
function saveTR(){const t=document.getElementById('trt').value.trim(),d=document.getElementById('trd').value.trim(),toId=document.getElementById('trto').value,dt=document.getElementById('trdt').value;if(!t||!d||!toId||!dt){toast('Fill required fields','danger');return;}const u=gA(toId),reqs=DB.get('task_requests')||[];reqs.push({id:nid('tr'),title:t,description:d,requestedBy:CU.id,requestedByName:CU.firstName+' '+CU.lastName,requestedTo:toId,requestedToName:u.firstName+' '+u.lastName,priority:document.getElementById('trp').value,neededBy:dt,status:'Pending',responseNote:'',assignedToId:'',assignedToName:'',created:new Date().toISOString()});DB.set('task_requests',reqs);logA('Task request "'+t+'" sent to '+u.firstName+' '+u.lastName);closeM();toast('Request sent','success');rTaskReqs();}
function handleTR(id){const reqs=DB.get('task_requests')||[];const r=reqs.find(x=>x.id===id);if(!r)return;openM('<div class="mh"><h3>Respond to Request</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div style="background:var(--sf2);border-radius:var(--rs);padding:11px;margin-bottom:12px"><div style="font-weight:600;margin-bottom:4px">'+r.title+'</div><div style="font-size:12px;color:var(--tx2)">'+r.description+'</div><div style="font-size:11px;color:var(--tx3);margin-top:5px">From: '+r.requestedByName+' · Needed: '+r.neededBy+'</div></div><div class="fg"><label>Response</label><select id="trrs"><option value="Accepted">Accept & Assign</option><option value="Rejected">Reject</option></select></div><div class="fg"><label>Assign To (if accepting)</label><select id="tras"><option value="">— Select —</option>'+sOpts()+'</select></div><div class="fg"><label>'+T('note')+'</label><textarea id="trnt" placeholder="Note to requester…"></textarea></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveTRResp(\''+id+'\')">Submit →</button></div>');}
function saveTRResp(id){const reqs=DB.get('task_requests')||[];const i=reqs.findIndex(r=>r.id===id);if(i<0)return;const resp=document.getElementById('trrs').value,aId=document.getElementById('tras').value;reqs[i].status=resp;reqs[i].responseNote=document.getElementById('trnt').value;if(resp==='Accepted'&&aId){const u=gA(aId);reqs[i].assignedToId=aId;reqs[i].assignedToName=u.firstName+' '+u.lastName;reqs[i].status='Assigned';const tasks=DB.get('tasks')||[];tasks.push({id:nid('t'),title:reqs[i].title,desc:reqs[i].description+' [Request from '+reqs[i].requestedByName+']',assignedTo:aId,assignedName:u.firstName+' '+u.lastName,assignedBy:CU.id,assignedByName:CU.firstName+' '+CU.lastName,status:'Pending',priority:reqs[i].priority,progress:0,dueDate:reqs[i].neededBy,taskType:'request',remarks:[],created:new Date().toISOString().split('T')[0],updated:new Date().toISOString().split('T')[0]});DB.set('tasks',tasks);}DB.set('task_requests',reqs);closeM();toast('Response sent','success');rTaskReqs();}
function rInfractions(){
  const inf=DB.get('infractions')||[];const canC=['superadmin','principal','vice_principal'].includes(CU.role);const canViewAll=canC||CU.role==='quality_incharge';const myInf=canViewAll?inf:inf.filter(i=>i.createdBy===CU.id);

  const totalPts=myInf.reduce((s,i)=>s+(parseInt(i.pointsDeducted)||0),0);
  document.getElementById('pc').innerHTML='<div class="card" style="margin-bottom:12px"><div class="sh2"><h3>⚠️ '+T('infractions')+' ('+myInf.length+')</h3>'+(canC?'<button class="btn bp bsm" onclick="addInfM()">+ '+T('add_infraction')+'</button>':'')+'</div><div style="font-size:11px;color:var(--tx3);margin-top:4px">School policy rubric — 5 degrees, occurrence-based procedures with point deductions.</div></div>'
  +'<div class="cg g4" style="margin-bottom:13px"><div class="stat bl"><div class="sl2">D1 Minor</div><div class="sv">'+byDeg['Degree 1 — Minor']+'</div><div class="sic">ℹ️</div></div><div class="stat go"><div class="sl2">D2 Moderate</div><div class="sv">'+byDeg['Degree 2 — Moderate']+'</div><div class="sic">⚠️</div></div><div class="stat rd"><div class="sl2">D3 + D4 + D5</div><div class="sv">'+(byDeg['Degree 3 — Serious']+byDeg['Degree 4 — Severe']+byDeg['Degree 5 — Critical'])+'</div><div class="sic">🚨</div></div><div class="stat go"><div class="sl2">Total Points Deducted</div><div class="sv">'+totalPts+'</div><div class="sic">📉</div></div></div>'
  +'<div class="card"><div class="tw"><table><thead><tr><th>'+T('date')+'</th><th>Student</th><th>'+T('degree')+'</th><th>Violation</th><th>Occurrence</th><th>Points</th><th>Guardian</th><th>Status</th><th>Actions</th></tr></thead><tbody>'
  +myInf.slice().reverse().map(i=>'<tr><td class="mono" style="font-size:11px">'+i.date+'</td><td><strong>'+i.studentName+'</strong><br><span style="font-size:10px;color:var(--tx3)">Gr '+i.grade+'-'+i.section+(i.studentId?' · Total: '+studentInfPoints(i.studentId)+' pts':'')+'</span></td><td><span class="badge '+infBadge(i.degree)+'">'+i.degree.split(' — ')[0]+'</span></td><td style="font-size:11px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(i.type||'')+'</td><td style="font-size:11px">'+(i.occurrence||'—')+'</td><td><strong style="color:var(--dn)">-'+(i.pointsDeducted||0)+'</strong></td><td style="font-size:10px"><span class="badge '+(i.guardianContact==='Contacted'?'bgn':i.guardianContact==='Pending'?'bgo':i.guardianContact==='No Response'?'brd':'bbl')+'">'+(i.guardianContact||'—')+'</span></td><td style="font-size:10px"><span class="badge '+(i.followUpStatus==='Resolved'?'bgn':i.followUpStatus==='Needs Additional Intervention'?'brd':'bgo')+'">'+(i.followUpStatus||'—').slice(0,18)+'</span></td><td><button class="btn bg2 bxs" onclick="vInf(\''+i.id+'\')">View</button></td></tr>').join('')
  +'</tbody></table></div>'+(myInf.length===0?'<div class="emp"><div class="ei">⚠️</div><p>'+T('no_records')+'</p></div>':'')+'</div>';
}
function addInfM(){openM('<div class="mh"><h3>⚠️ Add Infraction</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>Student *</label>'+sw('pickInfStu','infssi','infsd')+'</div><div id="infss" style="display:none" class="al ai"></div><input type="hidden" id="infsid"><div class="fr f2"><div class="fg"><label>'+T('degree')+' *</label><select id="infde" onchange="ldInfT()"><option value="">— Select —</option>'+INF_DEGREES.map(d=>'<option>'+d+'</option>').join('')+'</select></div><div class="fg"><label>Occurrence *</label><select id="infoc" onchange="updInfProc()"><option value="">— Select —</option>'+INF_OCCURRENCE.map(o=>'<option>'+o+'</option>').join('')+'</select></div></div><div class="fg"><label>'+T('infraction_type')+' / Violation *</label><select id="infty"><option value="">— Select degree first —</option></select></div><div class="fg"><label>Procedure (auto-suggested by degree + occurrence)</label><div id="infprocd" style="background:var(--sf2);padding:10px;border-radius:var(--rs);font-size:12px;color:var(--tx2);min-height:38px;display:flex;align-items:center"><em style="color:var(--tx3)">Select degree and occurrence first…</em></div><input type="hidden" id="infproc"><input type="hidden" id="infpts" value="0"></div><div class="fg"><label>'+T('description')+' / Detail *</label><textarea id="infd" placeholder="Describe what happened in detail"></textarea></div><div class="fr f3"><div class="fg"><label>'+T('date')+'</label><input type="date" id="infdt" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="fg"><label>Guardian Contact</label><select id="infgc"><option value="">— Select —</option>'+INF_GUARDIAN.map(g=>'<option>'+g+'</option>').join('')+'</select></div><div class="fg"><label>Follow-up Status</label><select id="inffu"><option value="">— Select —</option>'+INF_FOLLOWUP.map(f=>'<option>'+f+'</option>').join('')+'</select></div></div><div class="fg"><label>Notes (action taken, witnesses, etc.)</label><textarea id="infat" placeholder="Additional notes, action taken, who handled the case…"></textarea></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveInf()">Save →</button></div>');
  window.pickInfStu=function(sid){const s=gS(sid);document.getElementById('infsid').value=sid;document.getElementById('infssi').value=fN(s);document.getElementById('infsd').style.display='none';document.getElementById('infss').style.display='block';document.getElementById('infss').innerHTML='✓ '+fN(s)+' — Gr '+s.grade+'-'+s.section+' · <span style="color:var(--dn)">Existing points deducted: '+studentInfPoints(sid)+'</span>';};
  window.ldInfT=function(){const deg=document.getElementById('infde').value;document.getElementById('infty').innerHTML='<option value="">— Select —</option>'+(INF_VIOLATIONS[deg]||[]).map(t=>'<option>'+t+'</option>').join('');updInfProc();};
  window.updInfProc=function(){const deg=document.getElementById('infde').value,occ=document.getElementById('infoc').value;if(deg&&occ&&INF_PROCEDURES[deg]&&INF_PROCEDURES[deg][occ]){const p=INF_PROCEDURES[deg][occ];document.getElementById('infprocd').innerHTML='<div><div style="font-weight:600;color:var(--tx);margin-bottom:3px">'+esc(p.label)+'</div><div style="font-size:11px"><span class="badge '+(p.points>=10?'brd':p.points>=3?'bgo':'bbl')+'">Deducts '+p.points+' point(s)</span></div></div>';document.getElementById('infproc').value=p.label;document.getElementById('infpts').value=p.points;}else{document.getElementById('infprocd').innerHTML='<em style="color:var(--tx3)">Select degree and occurrence first…</em>';document.getElementById('infproc').value='';document.getElementById('infpts').value=0;}};
}
function saveInf(){const sid=document.getElementById('infsid').value,deg=document.getElementById('infde').value,occ=document.getElementById('infoc').value,type=document.getElementById('infty').value,desc=document.getElementById('infd').value.trim();if(!sid||!deg||!occ||!type||!desc){toast('Fill required fields (student, degree, occurrence, violation, description)','danger');return;}const s=gS(sid),inf=DB.get('infractions')||[];const proc=document.getElementById('infproc').value,pts=parseInt(document.getElementById('infpts').value)||0;inf.push({id:nid('inf'),studentId:sid,studentName:fN(s),grade:s.grade,section:s.section,degree:deg,occurrence:occ,type,description:desc,procedure:proc,pointsDeducted:pts,guardianContact:document.getElementById('infgc').value,followUpStatus:document.getElementById('inffu').value,actionTaken:document.getElementById('infat').value,date:document.getElementById('infdt').value,createdBy:CU.id,createdByName:CU.firstName+' '+CU.lastName,principalAck:'',created:new Date().toISOString()});DB.set('infractions',inf);logA(deg.split(' — ')[0]+' infraction for '+fN(s)+' ('+occ+', -'+pts+' pts): '+type);closeM();toast('Recorded ('+pts+' pts deducted)','success');rInfractions();}
function vInf(id){const inf=DB.get('infractions')||[];const i=inf.find(x=>x.id===id);if(!i)return;const canAck=['superadmin','principal'].includes(CU.role);const stuTotal=i.studentId?studentInfPoints(i.studentId):0;openM('<div class="mh"><h3>⚠️ Infraction Record</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div style="display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap"><span class="badge '+infBadge(i.degree)+'">'+i.degree+'</span><span class="badge bpu">'+(i.occurrence||'—')+'</span><span class="badge brd">-'+(i.pointsDeducted||0)+' pts</span>'+(i.guardianContact?'<span class="badge '+(i.guardianContact==='Contacted'?'bgn':i.guardianContact==='Pending'?'bgo':i.guardianContact==='No Response'?'brd':'bbl')+'">📞 '+i.guardianContact+'</span>':'')+(i.followUpStatus?'<span class="badge '+(i.followUpStatus==='Resolved'?'bgn':i.followUpStatus==='Needs Additional Intervention'?'brd':'bgo')+'">'+i.followUpStatus+'</span>':'')+'</div><div class="cg g3" style="margin-bottom:12px;font-size:12px"><div><div style="font-size:10px;color:var(--tx3)">Student</div><div style="font-weight:600">'+i.studentName+'</div><div style="font-size:11px;color:var(--tx3)">Gr '+i.grade+'-'+i.section+'</div></div><div><div style="font-size:10px;color:var(--tx3)">'+T('date')+'</div><div style="font-weight:600">'+i.date+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Recorded By</div><div style="font-weight:600">'+i.createdByName+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Student Total Points Deducted</div><div style="font-weight:700;color:var(--dn);font-size:16px">'+stuTotal+'</div></div></div><div class="fg"><label>Violation Type</label><div style="background:var(--sf2);padding:9px;border-radius:var(--rs);font-size:12px;color:var(--tx);font-weight:600">'+esc(i.type||'—')+'</div></div>'+(i.procedure?'<div class="fg"><label>Procedure Applied (Policy Rubric)</label><div style="background:var(--ac2);border:1px solid var(--ac3);padding:10px;border-radius:var(--rs);font-size:12px;color:var(--tx);line-height:1.5"><strong>'+esc(i.procedure)+'</strong></div></div>':'')+'<div class="fg"><label>'+T('description')+' / Detail</label><div style="background:var(--sf2);padding:10px;border-radius:var(--rs);font-size:12px;color:var(--tx2);line-height:1.6">'+esc(i.description||'—')+'</div></div>'+(i.actionTaken?'<div class="fg"><label>Notes / Action Taken</label><div style="background:var(--sf2);padding:10px;border-radius:var(--rs);font-size:12px;color:var(--tx2);line-height:1.6">'+esc(i.actionTaken)+'</div></div>':'')+(canAck?'<div class="fg"><label>'+T('principal_ack')+'</label><input id="ipk" value="'+esc(i.principalAck||'')+'" placeholder="Acknowledgment / final note…"></div>':i.principalAck?'<div class="al ag">🎯 <strong>Principal Ack:</strong> '+esc(i.principalAck)+'</div>':'')+'</div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('close')+'</button><button class="btn bg2 bsm" onclick="window.print()">🖨️</button>'+(canAck?'<button class="btn bo" onclick="saveInfAck(\''+id+'\')">Save Ack →</button>':'')+'</div>');}
function saveInfAck(id){const inf=DB.get('infractions')||[];const i=inf.findIndex(x=>x.id===id);if(i<0)return;inf[i].principalAck=document.getElementById('ipk').value;DB.set('infractions',inf);logA('Acknowledged infraction for '+inf[i].studentName);closeM();toast('Acknowledged','success');rInfractions();}

// Generate a unique random password like Tch@4829
function genPassword(){const d=Math.floor(1000+Math.random()*9000);return 'Tch@'+d;}
// Generate a unique username from a name, checking against existing accounts
function genUsername(fn,ln,acc){let base=(fn+(ln?'.'+ln.split(' ')[0]:'')).toLowerCase().replace(/[^a-z0-9.]/g,'');if(!base)base='user';let uname=base;let c=1;while(acc.find(a=>a.username===uname)){uname=base+c;c++;}return uname;}
// Auto-create a teacher login account from a teacher name
async function autoCreateTeacherAccount(fullName,teacherId){
  const acc=DB.get('accounts')||[];
  const parts=fullName.trim().split(/\s+/);
  const fn=parts[0]||'Teacher';
  const ln=parts.slice(1).join(' ')||'';
  const uname=genUsername(fn,ln,acc);
  const pw=genPassword();
  const ph=await hashPassword(pw);
  acc.push({id:'u'+Date.now()+Math.random().toString(36).slice(2,5),username:uname,passwordHash:ph,_cardPw:pw,role:'teacher',firstName:fn,lastName:ln,email:'',phone:'',active:true,theme:'blue',lang:'en',created:new Date().toISOString().split('T')[0],teacherId:teacherId});
  DB.set('accounts',acc);
  return {username:uname,password:pw};
}

async function saveTch(){
  const name=document.getElementById('tch-name').value.trim();
  if(!name){toast('Teacher name required','danger');return;}
  const teachers=DB.get('teachers')||[];

  const tchId=nid('tch');
  teachers.push({id:tchId,name,employeeId:document.getElementById('tch-eid').value.trim(),subject:document.getElementById('tch-subj').value.trim(),department:document.getElementById('tch-dep').value.trim(),phone:document.getElementById('tch-phone').value.trim(),email:document.getElementById('tch-email').value.trim(),note:document.getElementById('tch-note').value.trim(),active:true,created:new Date().toISOString().split('T')[0]});
  DB.set('teachers',teachers);
  // Auto-create teacher login account

function delTch(id){
  if(!confirm('Delete this teacher and their login account? Their existing class visits and activity reports will keep the name on record.'))return;
  // Also delete the linked account (account with teacherId === id, or role==='teacher' with matching name)
  const teacher=(DB.get('teachers')||[]).find(t=>t.id===id);
  const accounts=DB.get('accounts')||[];
  const updatedAccounts=accounts.filter(a=>{
    if(a.teacherId&&a.teacherId===id)return false;
    if(teacher&&a.role==='teacher'&&!a.teacherId){
      const accName=((a.firstName||'')+' '+(a.lastName||'')).trim().toLowerCase();
      if(accName===(teacher.name||'').trim().toLowerCase())return false;
    }
    return true;
  });
  if(updatedAccounts.length<accounts.length)DB.set('accounts',updatedAccounts);
  DB.set('teachers',(DB.get('teachers')||[]).filter(t=>t.id!==id));
  logA('Deleted teacher'+(teacher?' '+teacher.name:'')+' and linked account');toast('Teacher and account deleted','danger');rTeachers();
}

function impTchM(){
  openM('<div class="mh"><h3>📥 Import Teachers CSV / Excel</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="al ai">📋 Save your Excel file as <strong>CSV (.csv)</strong> first, then upload here. Two formats accepted:<br><br><strong>Simple (3 columns):</strong> Name, Subject, Phone<br><strong>Full (6 columns):</strong> Name, EmployeeID, Subject, Department, Phone, Email</div><div style="background:var(--sf2);border-radius:var(--rs);padding:9px;font-family:monospace;font-size:10px;color:var(--tx3);margin-bottom:12px">Simple example:<br>Mohammed Al-Saadi,Mathematics,0501234567<br>Layla Al-Najjar,Arabic,0502223344<br><br>Full example:<br>Mohammed Al-Saadi,T-1042,Mathematics,Science,0501234567,m@school.sa</div><div class="al aw" style="margin-bottom:12px">⚠️ The <strong>first row is treated as a header and skipped</strong>. Make sure your data starts from row 2.</div><div class="fg"><label>CSV File *</label><input type="file" id="tchimpf" accept=".csv,.txt"></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="procTchImp()">Import →</button></div>');
  window.procTchImp=async function(){const file=document.getElementById('tchimpf').files[0];if(!file){toast('Select file','danger');return;}const reader=new FileReader();reader.onload=async function(e){const lines=e.target.result.split(/\r?\n/).filter(l=>l.trim()).slice(1);const teachers=DB.get('teachers')||[];const newNames=[];let added=0,skipped=0;lines.forEach((line,idx)=>{const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));let name,eid,subj,dep,ph,em;if(cols.length>=6){[name,eid,subj,dep,ph,em]=cols;}else if(cols.length>=3){[name,subj,ph]=cols;eid='';dep='';em='';}else if(cols.length===2){[name,subj]=cols;eid='';dep='';ph='';em='';}else if(cols.length===1){name=cols[0];eid=subj=dep=ph=em='';}else{skipped++;return;}if(name&&name.trim()){const tchId='tch'+Date.now()+idx;teachers.push({id:tchId,name:name.trim(),employeeId:(eid||'').trim(),subject:(subj||'').trim(),department:(dep||'').trim(),phone:(ph||'').trim(),email:(em||'').trim(),note:'',active:true,created:new Date().toISOString().split('T')[0]});newNames.push({name:name.trim(),id:tchId});added++;}else skipped++;});DB.set('teachers',teachers);
      // Auto-create accounts for all imported teachers
      for(const t of newNames){await autoCreateTeacherAccount(t.name,t.id);}
      logA('Imported '+added+' teachers from CSV (accounts created)');closeM();toast(added+' teachers imported + accounts created'+(skipped?' ('+skipped+' rows skipped)':''),'success');rTeachers();};reader.readAsText(file);};
}

function tchSearch(q,did,onPickFn){
  const d=document.getElementById(did);if(!d)return;
  if(!q.trim()){d.style.display='none';return;}
  const teachers=(DB.get('teachers')||[]).filter(t=>t.active!==false);
  const ql=q.toLowerCase();

function vTchReports(tchId){

  document.getElementById('vtchcontent').innerHTML='<div class="card" style="margin-bottom:13px"><div class="sh2"><h3>👨‍🏫 '+esc(t.name)+'</h3><button class="btn bg2 bsm" onclick="window.print()">🖨️ Print</button></div><div class="cg g3" style="margin-bottom:12px;font-size:12px">'+(t.employeeId?'<div><div style="font-size:10px;color:var(--tx3)">Employee ID</div><div class="mono" style="font-weight:600">'+esc(t.employeeId)+'</div></div>':'')+(t.subject?'<div><div style="font-size:10px;color:var(--tx3)">'+T('subject')+'</div><div style="font-weight:600">'+esc(t.subject)+'</div></div>':'')+(t.department?'<div><div style="font-size:10px;color:var(--tx3)">Department</div><div style="font-weight:600">'+esc(t.department)+'</div></div>':'')+(t.phone?'<div><div style="font-size:10px;color:var(--tx3)">'+T('phone')+'</div><div class="mono" style="font-weight:600">'+esc(t.phone)+'</div></div>':'')+(t.email?'<div><div style="font-size:10px;color:var(--tx3)">'+T('email')+'</div><div style="font-weight:600">'+esc(t.email)+'</div></div>':'')+'</div></div><div class="card" style="margin-bottom:13px"><div class="sh2"><h3>📈 Performance Summary</h3></div><div class="cg g4" style="font-size:12px"><div style="background:var(--ac2);padding:14px;border-radius:var(--r);border:1px solid var(--ac3)"><div style="font-size:10px;color:var(--tx3);text-transform:uppercase">Total Visits</div><div style="font-size:24px;font-weight:700;color:var(--ac);margin-top:4px">'+visits.length+'</div></div><div style="background:var(--gdbg);padding:14px;border-radius:var(--r);border:1px solid #f2dc8f"><div style="font-size:10px;color:var(--tx3);text-transform:uppercase">Average Score</div><div style="font-size:24px;font-weight:700;color:var(--gd);margin-top:4px">'+avgScore+' / '+EVAL_TOTAL+'</div></div><div style="background:var(--subg);padding:14px;border-radius:var(--r);border:1px solid #87d6b0"><div style="font-size:10px;color:var(--tx3);text-transform:uppercase">Average %</div><div style="font-size:24px;font-weight:700;color:var(--su);margin-top:4px">'+avgPct+'%</div></div><div style="background:var(--pubg);padding:14px;border-radius:var(--r);border:1px solid #cfb9f7"><div style="font-size:10px;color:var(--tx3);text-transform:uppercase">Grade</div><div style="margin-top:8px"><span class="badge '+avgGrade.c+'" style="font-size:12px;padding:5px 10px">'+avgGrade.l+'</span></div></div></div>'+(validCount&&validCount<visits.length?'<div class="al aw" style="margin-top:11px;margin-bottom:0">⚠️ '+(visits.length-validCount)+' visit(s) have no rubric scores and are not included in the average.</div>':'')+'</div><div class="card" style="margin-bottom:13px"><div class="sh2"><h3>📊 Category Averages</h3></div>'+buildTchCategoryAvg(visits)+'</div><div class="card"><div class="sh2"><h3>📝 All Class Visit Reports ('+visits.length+')</h3></div>'+(visits.length===0?'<div class="emp"><div class="ei">📝</div><p>No class visits recorded for this teacher yet</p></div>':'<div class="tw"><table><thead><tr><th>'+T('date')+'</th><th>'+T('subject')+'</th><th>'+T('grade')+'</th><th>Score</th><th>'+T('rating')+'</th><th>Supervisor</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+visits.map(v=>{const tot=v.scores?evalGetTotal(v.scores):0;const pct=v.scores?Math.round(tot/EVAL_TOTAL*100):0;const g=v.scores?evalGetGrade(pct):{l:'—',c:'bgr'};return'<tr><td class="mono" style="font-size:11px">'+v.date+'</td><td>'+v.subject+'</td><td>Gr '+v.grade+(v.section?'-'+v.section:'')+'</td><td>'+(v.scores?'<strong style="color:var(--ac)">'+tot+'/'+EVAL_TOTAL+'</strong> <span style="font-size:10px;color:var(--tx3)">('+pct+'%)</span>':'<span style="color:var(--tx3)">—</span>')+'</td><td><span class="badge '+g.c+'">'+g.l+'</span></td><td style="font-size:11px;color:var(--tx3)">'+v.supervisorName+'</td><td>'+(v.principalAck?'<span class="badge bgn">🔒 Locked</span>':v.academicAck?'<span class="badge bbl">Academic ✓</span>':'<span class="badge bgo">Pending</span>')+'</td><td><button class="btn bg2 bxs" onclick="vVisit(\''+v.id+'\')">View Full</button></td></tr>';}).join('')+'</tbody></table></div>')+'</div>';

function buildTchCategoryAvg(visits){
  const validVisits=visits.filter(v=>v.scores);
  if(!validVisits.length)return'<div class="emp"><p style="font-size:12px">No scored visits available</p></div>';
  return EVAL_RUBRIC.map(cat=>{
    let catSum=0,catMax=0;
    cat.items.forEach(it=>{catMax+=it.max;});
    const catTotalMax=catMax*validVisits.length;
    validVisits.forEach(v=>{cat.items.forEach(it=>{catSum+=parseInt(v.scores[it.k])||0;});});
    const avgCat=Math.round(catSum/validVisits.length);
    const pctCat=Math.round(catSum/catTotalMax*100);
    const g=evalGetGrade(pctCat);
    return'<div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)"><div style="flex:1"><div style="font-size:12px;font-weight:600;color:var(--tx)">'+cat.cat+'</div><div style="font-size:10px;color:var(--tx3)">Average across '+validVisits.length+' visit(s)</div></div><div style="text-align:right;min-width:100px"><div style="font-size:14px;font-weight:700;color:var(--ac)">'+avgCat+' / '+catMax+'</div><div style="font-size:11px;color:var(--tx3)">'+pctCat+'%</div></div><span class="badge '+g.c+'" style="min-width:80px;justify-content:center">'+g.l+'</span></div>';
  }).join('');
}

function evalGetTotal(scores){let t=0;EVAL_RUBRIC.forEach(c=>c.items.forEach(it=>{t+=parseInt(scores?.[it.k])||0;}));return t;}
function evalGetGrade(pct){if(pct>=90)return{l:'Excellent',c:'bgn'};if(pct>=75)return{l:'Good',c:'btl'};if(pct>=60)return{l:'Satisfactory',c:'bgo'};return{l:'Needs Improvement',c:'brd'};}

}

function buildEvalForm(scores,readonly){
  let html='<div style="background:var(--sf2);padding:10px;border-radius:var(--rs);margin-bottom:13px;font-size:11px;color:var(--tx2)">📋 <strong>Teacher Performance Evaluation Card</strong> — Enter score for each criterion (max shown in brackets)</div>';
  EVAL_RUBRIC.forEach((cat,ci)=>{
    let catTotal=0,catMax=0;
    cat.items.forEach(it=>{catMax+=it.max;catTotal+=parseInt(scores?.[it.k])||0;});
    html+='<div style="background:var(--sf2);border-radius:var(--rs);padding:10px;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:var(--ac);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between"><span>'+(ci+1)+'. '+cat.cat+'</span><span style="color:var(--gd)">'+catTotal+'/'+catMax+'</span></div>';
    cat.items.forEach(it=>{
      const v=scores?.[it.k]||'';
      html+='<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd);font-size:12px"><div style="flex:1;color:var(--tx2)">'+it.l+'</div><div style="font-size:10px;color:var(--tx3);min-width:30px;text-align:right">/ '+it.max+'</div>'+(readonly?'<div style="min-width:50px;text-align:center;background:var(--ac2);color:var(--ac);padding:3px 8px;border-radius:4px;font-weight:600">'+(v||'—')+'</div>':'<input type="number" min="0" max="'+it.max+'" value="'+v+'" id="ev-'+it.k+'" oninput="updEvalTotal()" style="width:60px;padding:5px 7px;background:var(--sf);border:1px solid var(--bd);border-radius:4px;color:var(--tx);font-size:12px;text-align:center">')+'</div>';
    });
    html+='</div>';
  });
  const total=evalGetTotal(scores);const pct=Math.round(total/EVAL_TOTAL*100);const g=evalGetGrade(pct);
  html+='<div id="eval-tot" style="background:linear-gradient(135deg,var(--ac2),var(--pubg));border:1px solid var(--ac3);border-radius:var(--r);padding:14px;margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px">Total Score</div><div style="font-size:24px;font-weight:700;color:var(--ac);margin-top:2px"><span id="eval-total-num">'+total+'</span> / '+EVAL_TOTAL+'</div></div><div style="text-align:right"><div style="font-size:11px;color:var(--tx3)">Percentage</div><div style="font-size:20px;font-weight:700;color:var(--gd)" id="eval-pct">'+pct+'%</div><span class="badge '+g.c+'" id="eval-grade" style="margin-top:4px">'+g.l+'</span></div></div></div>';
  return html;
}

function updEvalTotal(){
  let total=0;EVAL_RUBRIC.forEach(c=>c.items.forEach(it=>{const el=document.getElementById('ev-'+it.k);if(el){let val=parseInt(el.value)||0;if(val>it.max){val=it.max;el.value=val;}if(val<0){val=0;el.value=val;}total+=val;}}));
  const pct=Math.round(total/EVAL_TOTAL*100);const g=evalGetGrade(pct);
  const tn=document.getElementById('eval-total-num');if(tn)tn.textContent=total;
  const pe=document.getElementById('eval-pct');if(pe)pe.textContent=pct+'%';
  const ge=document.getElementById('eval-grade');if(ge){ge.textContent=g.l;ge.className='badge '+g.c;}
}

function gatherEvalScores(){const s={};EVAL_RUBRIC.forEach(c=>c.items.forEach(it=>{const el=document.getElementById('ev-'+it.k);s[it.k]=el?parseInt(el.value)||0:0;}));return s;}

function addVisitM(){
  openM('<div class="mh"><h3>📝 Teacher Performance Evaluation</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>'+T('teacher')+' *</label>'+tchSearchWidget('cv-tch-i','cv-tch-d','pickCvTch')+'</div><div id="cv-tch-info" style="display:none" class="al ai"></div><input type="hidden" id="cvt"><div class="fg"><label>'+T('subject')+' *</label><input id="cvs"></div><div class="fr f3"><div class="fg"><label>'+T('grade')+'</label><input id="cvg"></div><div class="fg"><label>'+T('section')+'</label><input id="cvsc"></div><div class="fg"><label>'+T('period')+'</label><input id="cvp"></div></div><div class="fr f2"><div class="fg"><label>'+T('date')+'</label><input type="date" id="cvd" value="'+new Date().toISOString().split('T')[0]+'"></div><div class="fg"><label>Visit Type</label><select id="cvty"><option>Scheduled</option><option>Unannounced</option><option>Follow-up</option></select></div></div>'+buildEvalForm({},false)+'<div class="fg" style="margin-top:13px"><label>'+T('strengths')+'</label><textarea id="cvst" placeholder="What the teacher did well..."></textarea></div><div class="fg"><label>'+T('improvements')+'</label><textarea id="cvi" placeholder="Areas for improvement..."></textarea></div><div class="fg"><label>'+T('follow_up')+'</label><textarea id="cvf" placeholder="Recommended follow-up actions..."></textarea></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveVisit()">Submit Evaluation →</button></div>',true);
  window.pickCvTch=function(tid){const t=(DB.get('teachers')||[]).find(x=>x.id===tid);if(!t)return;document.getElementById('cv-tch-i').value=t.name;document.getElementById('cvt').value=t.name;document.getElementById('cv-tch-d').style.display='none';document.getElementById('cv-tch-info').style.display='block';document.getElementById('cv-tch-info').innerHTML='✓ <strong>'+esc(t.name)+'</strong>'+(t.subject?' — '+esc(t.subject):'')+(t.department?' · '+esc(t.department):'');if(t.subject&&!document.getElementById('cvs').value)document.getElementById('cvs').value=t.subject;};
}

function saveVisit(){
  const t=document.getElementById('cvt').value.trim(),s=document.getElementById('cvs').value.trim();
  if(!t||!s){toast('Teacher and subject required','danger');return;}
  const scores=gatherEvalScores();const total=evalGetTotal(scores);const pct=Math.round(total/EVAL_TOTAL*100);
  const visits=DB.get('class_visits')||[];
  visits.push({id:nid('cv'),supervisorId:CU.id,supervisorName:CU.firstName+' '+CU.lastName,supervisorRole:CU.role,teacher:t,subject:s,grade:document.getElementById('cvg').value,section:document.getElementById('cvsc').value,date:document.getElementById('cvd').value,period:document.getElementById('cvp').value,visitType:document.getElementById('cvty').value,scores,totalScore:total,percentage:pct,strengths:document.getElementById('cvst').value,improvements:document.getElementById('cvi').value,followUp:document.getElementById('cvf').value,academicAck:'',academicAckDate:'',principalAck:'',principalAckDate:'',created:new Date().toISOString().split('T')[0]});
  DB.set('class_visits',visits);logA('Class visit evaluation submitted for '+t+' ('+total+'/'+EVAL_TOTAL+')');closeM();toast('Evaluation submitted: '+total+'/'+EVAL_TOTAL+' ('+pct+'%)','success');rClassVisits();
}

function vVisit(id){
  const visits=DB.get('class_visits')||[];const v=visits.find(x=>x.id===id);if(!v)return;
  const isP=['superadmin','principal','quality_incharge'].includes(CU.role),isAc=CU.role==='academic_supervisor',isSup=v.supervisorId===CU.id;

  if(reports[i].createdBy!==CU.id&&CU.role!=='superadmin'){toast('Not authorized','danger');return;}
  reports[i].activityName=document.getElementById('are-name').value.trim()||reports[i].activityName;
  reports[i].teacher=document.getElementById('are-teacher').value.trim()||reports[i].teacher;
  reports[i].activityDate=document.getElementById('are-date').value||reports[i].activityDate;
  reports[i].additionalNote=document.getElementById('are-note').value;
  DB.set('activity_reports',reports);logA('Edited activity report: '+reports[i].activityName);
  closeM();toast('Updated','success');rActivityReports();
}

function delAr(id){
  if(!confirm('Delete this activity report?'))return;
  DB.set('activity_reports',(DB.get('activity_reports')||[]).filter(r=>r.id!==id));
  logA('Deleted activity report');toast('Deleted','danger');rActivityReports();
}

function exportArM(){
  openM('<div class="mh"><h3>📥 Export Activity Reports</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="al ai">Select date range and format. Leave dates empty to export all reports.</div><div class="fr f2"><div class="fg"><label>From Date</label><input type="date" id="ar-exp-from"></div><div class="fg"><label>To Date</label><input type="date" id="ar-exp-to"></div></div><div class="fg"><label>Filter by Teacher (optional)</label><input id="ar-exp-teacher" placeholder="Leave blank for all teachers"></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bg2" onclick="doExportAr(\'csv\')">📊 Excel (CSV)</button><button class="btn bp" onclick="doExportAr(\'pdf\')">📄 PDF</button></div>');
}

function doExportAr(fmt){
  const from=document.getElementById('ar-exp-from').value,to=document.getElementById('ar-exp-to').value,tf=document.getElementById('ar-exp-teacher').value.trim().toLowerCase();
  let data=DB.get('activity_reports')||[];
  // Activity Incharge can only export their own reports
  if(CU.role==='activity_incharge')data=data.filter(r=>r.createdBy===CU.id);
  if(from)data=data.filter(r=>r.activityDate>=from);
  if(to)data=data.filter(r=>r.activityDate<=to);
  if(tf)data=data.filter(r=>r.teacher.toLowerCase().includes(tf));
  data.sort((a,b)=>a.activityDate.localeCompare(b.activityDate));
  if(!data.length){toast('No reports match your filters','danger');return;}
  const headers=['Activity Name','Teacher Conducted','Activity Date','Submitted By','Submitted On','Additional Note'];
  const rows=data.map(r=>[r.activityName,r.teacher,r.activityDate,r.createdByName,(r.created||'').split('T')[0],r.additionalNote||'']);
  const range=from||to?(' ('+(from||'all')+' to '+(to||'all')+')'):'';
  const fn='activity_reports'+(from||to?'_'+(from||'start')+'_to_'+(to||'end'):'');
  if(fmt==='csv'){expCSV(headers,rows,fn);}else{expPDF('Activity Reports'+range,headers,rows);}
  closeM();
  logA('Exported '+data.length+' activity reports as '+fmt.toUpperCase());
}
