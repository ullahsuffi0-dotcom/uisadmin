  const canIssue=['principal','superadmin'].includes(CU.role);
  // Build unified reply display: check both admin reply (w.reply) and teacher reply (w.replyText)
  const hasAdminReply=w.reply;
  const hasTeacherReply=w.replyText;
  const hasAnyReply=hasAdminReply||hasTeacherReply;
  let replyHtml='';
  if(hasTeacherReply){
    replyHtml='<div style="background:var(--gdbg);border-left:4px solid var(--gd);border-radius:var(--rs);padding:12px;margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px"><div><strong style="color:var(--gd);font-size:13px">📨 Written Reply from Recipient</strong><div style="font-size:10px;color:var(--tx3)">Submitted by '+esc(w.repliedBy||w.recipientName||'—')+' on '+(w.replyDate?new Date(w.replyDate).toLocaleString():'—')+'</div></div></div>'
    +'<div style="font-size:12px;color:var(--tx);line-height:1.7;white-space:pre-wrap;background:var(--sf);padding:12px;border-radius:var(--rs);margin-bottom:8px;border:1px solid var(--bd)">'+esc(w.replyText)+'</div>'
    +(w.replyAttachment&&w.replyAttachment.name?'<div style="background:var(--sf);padding:9px 11px;border-radius:var(--rs);display:flex;justify-content:space-between;align-items:center"><div><strong>📎 '+esc(w.replyAttachment.name)+'</strong> <span style="color:var(--tx3);font-size:10px">'+(w.replyAttachment.size?formatBytes(w.replyAttachment.size):'')+'</span></div>'+(w.replyAttachment.data?'<a href="'+w.replyAttachment.data+'" download="'+esc(w.replyAttachment.name)+'" class="btn bp bxs" style="text-decoration:none">Download</a>':'')+'</div>':'')
    +'</div>';
  }else if(hasAdminReply){
    replyHtml='<div style="background:var(--gdbg);border-left:4px solid var(--gd);border-radius:var(--rs);padding:12px;margin-top:8px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px"><div><strong style="color:var(--gd);font-size:13px">📨 Reply Received</strong><div style="font-size:10px;color:var(--tx3)">Uploaded by '+esc(w.reply.uploadedBy||'—')+' on '+(w.reply.uploadedAt?new Date(w.reply.uploadedAt).toLocaleString():'—')+'</div></div>'+(canIssue?'<button class="btn bd3 bxs" onclick="rmWarningReply(\''+w.id+'\')">Remove Reply</button>':'')+'</div>'+(w.reply.notes?'<div style="font-size:12px;color:var(--tx2);line-height:1.6;margin-bottom:8px;white-space:pre-wrap;background:var(--sf);padding:9px;border-radius:var(--rs)">'+esc(w.reply.notes)+'</div>':'')+(w.reply.fileName?'<div style="background:var(--sf);padding:9px 11px;border-radius:var(--rs);display:flex;justify-content:space-between;align-items:center"><div><strong>📎 '+esc(w.reply.fileName)+'</strong> <span style="color:var(--tx3);font-size:10px">'+(w.reply.fileSize?formatBytes(w.reply.fileSize):'')+'</span></div>'+(w.reply.fileData?'<a href="'+w.reply.fileData+'" download="'+esc(w.reply.fileName)+'" class="btn bp bxs" style="text-decoration:none">Download</a>':'')+'</div>':'')+'</div>';
  }else{
    replyHtml='<div style="background:var(--sf2);border:2px dashed var(--bd);border-radius:var(--rs);padding:15px;text-align:center;margin-top:8px"><div style="color:var(--tx3);font-size:12px;margin-bottom:9px">No reply received yet — the recipient can reply from their account</div>'+(canIssue||CU.id===w.issuedBy?'<button class="btn bp bsm" onclick="addWarningReplyM(\''+w.id+'\')">📨 Attach Reply on Behalf</button>':'')+'</div>';
  }

  openM('<div class="mh"><h3>📝 Explanation Letter</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2">'
  +'<div class="cg g2" style="margin-bottom:13px;font-size:12px"><div><div style="font-size:10px;color:var(--tx3)">Recipient</div><div style="font-weight:700">'+esc(w.recipientName)+'</div><div style="font-size:11px;color:var(--tx3)">'+esc(w.recipientRole||'')+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Type</div><div style="font-weight:600">'+esc(w.type)+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Date</div><div style="font-weight:600">'+w.date+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Issued By</div><div style="font-weight:600">'+esc(w.issuedByName)+'</div></div></div>'
  +'<div class="fg"><label>Subject</label><div style="background:var(--ac2);padding:11px;border-radius:var(--rs);font-size:14px;color:var(--tx);font-weight:600;border-left:3px solid var(--ac)">'+esc(w.subject)+'</div></div>'
  +'<div class="fg"><label>Content</label><div style="background:var(--sf2);padding:13px;border-radius:var(--rs);font-size:12px;color:var(--tx2);line-height:1.7;white-space:pre-wrap">'+esc(w.content||w.reasons||'')+(w.actions?'\n\n'+w.actions:'')+(w.consequences?'\n\n'+w.consequences:'')+'</div></div>'

function addWarningReplyM(id){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.id='wn-reply-modal';
  overlay.innerHTML='<div style="background:var(--sf);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shl)"><div class="mh"><h3>📨 Attach Reply on Behalf</h3><button class="mc" onclick="document.getElementById(\'wn-reply-modal\').remove()">×</button></div><div class="mb2"><div class="al ai">📋 Upload the recipient\'s reply (under 1MB) and add notes. The reply will be permanently linked to this explanation letter.</div><div class="fg"><label>Reply Notes (optional)</label><textarea id="wn-rnotes" placeholder="Brief notes about the reply, e.g. \'Acknowledged on Jan 15 — committed to corrective plan\'" style="min-height:80px"></textarea></div><div class="fg" style="margin-bottom:0"><label>Reply File</label><input type="file" id="wn-rfile" accept="application/pdf,.pdf,.doc,.docx"><div style="font-size:10px;color:var(--tx3);margin-top:4px">Max 1MB. For larger files, upload to Google Drive and paste the link in notes above.</div></div></div><div class="mf"><button class="btn bg2" onclick="document.getElementById(\'wn-reply-modal\').remove()">'+T('cancel')+'</button><button class="btn bp" onclick="saveWarningReply(\''+id+'\')">📨 Save Reply →</button></div></div>';
  document.body.appendChild(overlay);
}

function saveWarningReply(id){
  const notes=document.getElementById('wn-rnotes').value.trim();
  const fileInput=document.getElementById('wn-rfile');
  const file=fileInput.files[0];
  if(!notes&&!file){toast('Add notes or attach a file','danger');return;}
  const finishSave=(fileData,fileName,fileSize)=>{
    const list=DB.get('warning_letters')||[];const i=list.findIndex(w=>w.id===id);if(i<0)return;
    list[i].reply={notes,fileName:fileName||'',fileSize:fileSize||0,fileData:fileData||'',uploadedBy:CU.firstName+' '+CU.lastName,uploadedAt:new Date().toISOString()};
    try{
      DB.set('warning_letters',list);
      logA('Attached reply to explanation letter: '+list[i].subject);
      const m=document.getElementById('wn-reply-modal');if(m)m.remove();
      toast('Reply attached','success');closeM();vWarning(id);
    }catch(e){
      if(e.name==='QuotaExceededError'){toast('Storage quota exceeded — file too large for inline storage','danger');}
      else{toast('Save error: '+e.message,'danger');}
    }
  };
  if(file){
    if(file.size>1024*1024){toast('File too large ('+formatBytes(file.size)+'). Max 1MB.','danger');return;}
    const reader=new FileReader();
    reader.onload=e=>finishSave(e.target.result,file.name,file.size);
    reader.readAsDataURL(file);
  }else{
    finishSave('','',0);
  }
}

function rmWarningReply(id){
  if(!confirm('Remove the reply attachment?'))return;
  const list=DB.get('warning_letters')||[];const i=list.findIndex(w=>w.id===id);if(i<0)return;
  list[i].reply=null;DB.set('warning_letters',list);
  logA('Removed reply from explanation letter: '+list[i].subject);
  toast('Reply removed','danger');closeM();vWarning(id);
}

function bulkStuDelete(){
  const count=(DB.get('students')||[]).length;
  if(!count){toast('No students to delete','info');return;}

  DB.set('students',[]);
  logA('SUPER ADMIN: Deleted all '+count+' students (bulk operation)');
  closeM();toast('All '+count+' students deleted','danger');rStudents();
}

function bulkStuReplace(){
  const file=document.getElementById('bulkstu-file').files[0];
  if(!file){toast('Pick a CSV file first','danger');return;}
  const oldCount=(DB.get('students')||[]).length;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split(/\r?\n/).filter(l=>l.trim()).slice(1);
    if(!lines.length){toast('CSV file is empty (or only has a header)','danger');return;}
    const newStudents=[];
    let parseErr=0;
    lines.forEach((line,idx)=>{
      const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      // Expected: SN, CS, FirstName, LastName, Grade, Section, Gender, Nationality, FatherPhone, MotherPhone
      // Be tolerant: accept short forms too
      let sn,cs,first,last,grade,section,gender,nat,fp,mp;
      if(cols.length>=10){[sn,cs,first,last,grade,section,gender,nat,fp,mp]=cols;}
      else if(cols.length>=6){[sn,cs,first,last,grade,section]=cols;gender=nat=fp=mp='';}
      else{parseErr++;return;}
      if(!first&&!last&&!grade){parseErr++;return;}
      newStudents.push({id:'st'+Date.now()+'-'+idx,sn:sn||'',csn:cs||'',firstName:first||'',lastName:last||'',grade:grade||'',section:section||'',gender:gender||'',nationality:nat||'',fatherPhone:fp||'',motherPhone:mp||'',created:new Date().toISOString().split('T')[0]});
    });
    if(!newStudents.length){toast('No valid rows in CSV','danger');return;}
    const confirm1=prompt('This will DELETE all '+oldCount+' existing students and replace with '+newStudents.length+' new records.\n\nType REPLACE to confirm:');
    if(confirm1!=='REPLACE'){toast('Cancelled — confirmation text did not match','info');return;}
    DB.set('students',newStudents);
    logA('SUPER ADMIN: Replaced all students — removed '+oldCount+', imported '+newStudents.length);
    closeM();toast('Replaced: '+oldCount+' removed, '+newStudents.length+' imported'+(parseErr?' ('+parseErr+' rows skipped)':''),'success');rStudents();
  };
  reader.readAsText(file);
}

  if(confirm1!=='DELETE ALL'){toast('Cancelled — confirmation text did not match','info');return;}
  // Also delete all teacher accounts
  const tchIds=new Set(teachers.map(t=>t.id));
  const tchNames=new Set(teachers.map(t=>(t.name||'').trim().toLowerCase()));
  const accounts=DB.get('accounts')||[];
  const updatedAccounts=accounts.filter(a=>{
    if(a.teacherId&&tchIds.has(a.teacherId))return false;
    if(a.role==='teacher'&&!a.teacherId){
      const accName=((a.firstName||'')+' '+(a.lastName||'')).trim().toLowerCase();
      if(tchNames.has(accName))return false;
    }
    return true;
  });
  const deletedAccounts=accounts.length-updatedAccounts.length;
  DB.set('accounts',updatedAccounts);
  DB.set('teachers',[]);
  logA('SUPER ADMIN: Deleted all '+count+' teachers and '+deletedAccounts+' linked accounts (bulk operation)');
  closeM();toast('All '+count+' teachers and '+deletedAccounts+' accounts deleted','danger');rTeachers();
}

function bulkTchReplace(){
  const file=document.getElementById('bulktch-file').files[0];
  if(!file){toast('Pick a CSV file first','danger');return;}
  const oldCount=(DB.get('teachers')||[]).length;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split(/\r?\n/).filter(l=>l.trim()).slice(1);
    if(!lines.length){toast('CSV file is empty (or only has a header)','danger');return;}
    const newTeachers=[];
    let parseErr=0;
    lines.forEach((line,idx)=>{
      const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      let name,eid,subj,dep,ph,em;
      if(cols.length>=6){[name,eid,subj,dep,ph,em]=cols;}
      else if(cols.length>=3){[name,subj,ph]=cols;eid='';dep='';em='';}
      else if(cols.length===2){[name,subj]=cols;eid='';dep='';ph='';em='';}
      else if(cols.length===1){name=cols[0];eid=subj=dep=ph=em='';}
      else{parseErr++;return;}
      if(!name||!name.trim()){parseErr++;return;}
      newTeachers.push({id:'tch'+Date.now()+'-'+idx,name:name.trim(),employeeId:(eid||'').trim(),subject:(subj||'').trim(),department:(dep||'').trim(),phone:(ph||'').trim(),email:(em||'').trim(),note:'',active:true,created:new Date().toISOString().split('T')[0]});
    });
    if(!newTeachers.length){toast('No valid rows in CSV','danger');return;}
    const confirm1=prompt('This will DELETE all '+oldCount+' existing teachers and replace with '+newTeachers.length+' new records.\n\nType REPLACE to confirm:');
    if(confirm1!=='REPLACE'){toast('Cancelled — confirmation text did not match','info');return;}
    DB.set('teachers',newTeachers);
    logA('SUPER ADMIN: Replaced all teachers — removed '+oldCount+', imported '+newTeachers.length);
    closeM();toast('Replaced: '+oldCount+' removed, '+newTeachers.length+' imported'+(parseErr?' ('+parseErr+' rows skipped)':''),'success');rTeachers();
  };
  reader.readAsText(file);
}

function saveAchievement(){

  const list=DB.get('teacher_achievements')||[];

    teacherId:tid||null,

function genPickupQR(p){
  const payload={
    type:'EARLY_PICKUP',
    student:p.studentName,
    grade:p.grade,
    guardian:p.guardianName,
    guardianPhone:p.guardianPhone,
    pickedBy:p.pickedBy||'',
    pickedByName:p.pickedByName||'',
    pickedByPhone:p.pickedByPhone||'',
    pickedById:p.pickedById||'',
    reason:p.reason,
    pickupTime:p.pickupTime,
    status:p.status,
    handledBy:p.handledBy||'',
    issuedAt:p.qrIssuedAt||new Date().toISOString(),
    ref:p.id
  };
  const data=JSON.stringify(payload);
  return'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data='+encodeURIComponent(data);
}

function addExamSessionM(){

}

function saveExamSession(){
  const name=document.getElementById('es-name').value.trim();
  const status=document.getElementById('es-status').value;
  if(!name){toast('Session name required','danger');return;}
  const sessions=DB.get('exam_sessions')||[];
  if(sessions.find(s=>s.name.toLowerCase()===name.toLowerCase())){toast('Session already exists','danger');return;}
  sessions.push({id:nid('es'),name:name,status:status,createdBy:(CU.firstName||'')+' '+(CU.lastName||''),created:new Date().toISOString().split('T')[0]});
  DB.set('exam_sessions',sessions);
  logA('Created exam session: '+name);
  closeM();toast('Session created','success');rExamAbsent();
}

function editExamSessionM(id){
  const sessions=DB.get('exam_sessions')||[];
  const s=sessions.find(x=>x.id===id);if(!s)return;
  openM('<div class="mh"><h3>✏️ Edit Session</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>Session Name *</label><input id="es-name" value="'+esc(s.name)+'"></div><div class="fg"><label>Status</label><select id="es-status"><option value="active"'+(s.status==='active'?' selected':'')+'>Active</option><option value="closed"'+(s.status==='closed'?' selected':'')+'>Closed</option></select></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveEditExamSession(\''+id+'\')">'+T('save')+' →</button></div>');
}

function saveEditExamSession(id){
  const name=document.getElementById('es-name').value.trim();
  const status=document.getElementById('es-status').value;
  if(!name){toast('Session name required','danger');return;}
  const sessions=DB.get('exam_sessions')||[];
  const i=sessions.findIndex(s=>s.id===id);if(i<0)return;
  const oldName=sessions[i].name;
  // If name changed, update all absents linked to old name
  if(oldName!==name){
    const abs=DB.get('exam_absents')||[];
    abs.forEach(a=>{if(a.examSession===oldName)a.examSession=name;});
    DB.set('exam_absents',abs);
  }
  sessions[i].name=name;sessions[i].status=status;
  DB.set('exam_sessions',sessions);
  logA('Edited exam session: '+name);
  closeM();toast('Updated','success');rExamAbsent();
}

function delExamSession(id){
  const sessions=DB.get('exam_sessions')||[];
  const s=sessions.find(x=>x.id===id);if(!s)return;
  const abs=DB.get('exam_absents')||[];
  const linked=abs.filter(a=>a.examSession===s.name).length;
  if(!confirm('Delete session "'+s.name+'"?'+(linked?' This will NOT delete the '+linked+' absent record(s) linked to it.':'')))return;
  DB.set('exam_sessions',sessions.filter(x=>x.id!==id));
  logA('Deleted exam session: '+s.name);
  toast('Session deleted','danger');rExamAbsent();
}

  }).join('')+'</tbody></table></div>';
}

// ─── Absent Students tab — main entry point for creating schedules ───
function renderRexAbsentStudents(){
  const abs=DB.get('exam_absents')||[];
  const schedules=DB.get('reexam_schedules')||[];
  // Build unique student map from absences
  const stuMap={};
  abs.forEach(a=>{
    const k=a.studentId||a.studentName;
    if(!stuMap[k])stuMap[k]={studentId:a.studentId,studentName:a.studentName,grade:a.grade,section:a.section,subjects:new Set()};
    stuMap[k].subjects.add(a.subject);
  });
  const students=Object.values(stuMap).sort((a,b)=>a.studentName.localeCompare(b.studentName));

  // For each student, check schedule status
  const rows=students.map(stu=>{
    const absentSubjects=[...stu.subjects];
    // Find any existing schedule for this student
    const existing=schedules.find(r=>(stu.studentId&&r.studentId===stu.studentId)||r.studentName===stu.studentName);
    let status='Not Created',statusClass='bgr',scheduledSubjects=[];
    if(existing){
      scheduledSubjects=(existing.subjects||[]).map(s=>s.subject);
      const allCovered=absentSubjects.every(s=>scheduledSubjects.includes(s));
      if(allCovered){status='Created';statusClass='bgn';}
      else{status='Partial';statusClass='bgo';}
    }
    return{...stu,absentSubjects,existing,status,statusClass,scheduledSubjects};
  });

  document.getElementById('rexview').innerHTML='<div class="card">'
  +'<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap"><input id="rexabsq" placeholder="Search student name…" oninput="fltRexAbs()" style="flex:1;padding:9px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:13px"><select id="rexabsf" onchange="fltRexAbs()" style="padding:9px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:12px"><option value="">All</option><option value="Not Created">Not Created</option><option value="Partial">Partial</option><option value="Created">Created</option></select></div>'
  +'<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;font-size:11px"><span style="color:var(--tx3)">Total: <strong>'+students.length+'</strong></span><span style="color:#16a34a">Created: <strong>'+rows.filter(r=>r.status==='Created').length+'</strong></span><span style="color:#d97706">Partial: <strong>'+rows.filter(r=>r.status==='Partial').length+'</strong></span><span style="color:#dc2626">Not Created: <strong>'+rows.filter(r=>r.status==='Not Created').length+'</strong></span></div>'
  +'<div id="rexabsw">'+buildRexAbsTbl(rows)+'</div></div>';
  window._rexAbsRows=rows;
  window.fltRexAbs=function(){
    const q=(document.getElementById('rexabsq').value||'').toLowerCase();
    const sf=document.getElementById('rexabsf').value;
    let filtered=window._rexAbsRows;
    if(q)filtered=filtered.filter(r=>r.studentName.toLowerCase().includes(q));

function addReexamForStudent(sid,sname){
  // Pre-fill the form with this student's data
  const abs=DB.get('exam_absents')||[];
  const stuAbs=abs.filter(a=>(sid&&a.studentId===sid)||a.studentName===sname);

  const subjMap={};
  stuAbs.forEach(a=>{

    subjMap[a.subject].absentDates.push(a.absentDate);
  });
  window._rexEdit={
    isNew:true,

    studentName:stuAbs[0].studentName,
    grade:stuAbs[0].grade||'',

// Full Session Report PDF — all students in one session
function expSessionReportPDF(session){
  const list=(DB.get('reexam_schedules')||[]).filter(r=>r.examSession===session);
  if(!list.length){toast('No schedules found for this session','danger');return;}
  const settings=DB.get('settings')||{};
  const win=window.open('','_blank');
  const totalSubjs=list.reduce((a,r)=>a+(r.subjects||[]).length,0);
  const conductedSubjs=list.reduce((a,r)=>a+(r.subjects||[]).filter(s=>s.examStatus==='Conducted').length,0);
  const notConducted=list.reduce((a,r)=>a+(r.subjects||[]).filter(s=>s.examStatus==='Not Conducted').length,0);
  const pending=totalSubjs-conductedSubjs-notConducted;
  const completedStudents=list.filter(r=>(r.subjects||[]).every(s=>s.examStatus==='Conducted'||s.examStatus==='Not Conducted')).length;

  // Build rows: one row per student-subject
  let rowsHTML='';let rowNum=0;
  list.sort((a,b)=>a.studentName.localeCompare(b.studentName)).forEach(r=>{
    (r.subjects||[]).forEach((s,si)=>{
      rowNum++;
      const st=s.examStatus||'Pending';
      rowsHTML+='<tr>'+(si===0?'<td rowspan="'+(r.subjects||[]).length+'" style="vertical-align:top;font-weight:bold">'+r.studentName+'</td><td rowspan="'+(r.subjects||[]).length+'" style="vertical-align:top">'+(r.grade||'')+(r.section||'')+'</td>':'')+'<td>'+s.subject+'</td><td>'+(s.examDate||'—')+'</td><td>'+(s.startTime||'—')+(s.endTime?' - '+s.endTime:'')+'</td><td>'+(s.venue||'—')+'</td><td>'+(s.invigilator||'—')+'</td><td class="'+(st==='Conducted'?'conducted':st==='Not Conducted'?'not-conducted':st==='Postponed'?'postponed':'pending')+'">'+st+'</td><td style="font-size:9px">'+(s.remarks||'—')+'</td></tr>';
    });
  });

  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Session Report — '+session+'</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:Arial,sans-serif;color:#1a3a5c;font-size:10px;line-height:1.4}.title{font-size:18px;color:#1a5f7a;text-align:center;margin:8px 0 4px;font-weight:bold}.subtitle{text-align:center;font-size:12px;color:#555;margin-bottom:12px}.stats{display:flex;justify-content:center;gap:20px;margin-bottom:12px;flex-wrap:wrap}.stat-box{background:#f0f4f8;border-radius:6px;padding:8px 16px;text-align:center;min-width:90px}.stat-box .num{font-size:20px;font-weight:bold;color:#1a5f7a}.stat-box .lbl{font-size:9px;color:#777;text-transform:uppercase}table{width:100%;border-collapse:collapse;font-size:10px}td,th{padding:5px 6px;border:1px solid #ccc;text-align:left}th{background:#1a5f7a;color:#fff;font-size:9px;text-transform:uppercase}.conducted{color:#16a34a;font-weight:bold}.not-conducted{color:#dc2626;font-weight:bold}.pending{color:#d97706}.postponed{color:#6366f1;font-weight:bold}.footer{margin-top:16px;padding-top:6px;border-top:1px solid #ddd;font-size:8px;color:#888;text-align:center}@media print{button{display:none}}</style></head><body>'+pdfHeaderHTML({subtitle:'Re-exam Session Report'})+'<div class="title">RE-EXAM SESSION REPORT</div><div class="subtitle">'+session+' — '+(settings.schoolName||'School')+'</div><div class="stats"><div class="stat-box"><div class="num">'+list.length+'</div><div class="lbl">Students</div></div><div class="stat-box"><div class="num">'+totalSubjs+'</div><div class="lbl">Total Exams</div></div><div class="stat-box"><div class="num" style="color:#16a34a">'+conductedSubjs+'</div><div class="lbl">Conducted</div></div><div class="stat-box"><div class="num" style="color:#dc2626">'+notConducted+'</div><div class="lbl">Not Conducted</div></div><div class="stat-box"><div class="num" style="color:#d97706">'+pending+'</div><div class="lbl">Pending</div></div></div><table><thead><tr><th>Student</th><th>Class</th><th>Subject</th><th>Re-exam Date</th><th>Time</th><th>Venue</th><th>Invigilator</th><th>Status</th><th>Remarks</th></tr></thead><tbody>'+rowsHTML+'</tbody></table><div class="footer">Generated from '+(settings.schoolName||'School')+' on '+new Date().toLocaleString()+' | '+completedStudents+'/'+list.length+' students fully processed</div><button onclick="window.print()" style="margin-top:10px;padding:8px 16px;background:#1a5f7a;color:#fff;border:none;border-radius:4px;cursor:pointer">Print / Save as PDF</button></body></html>');
  win.document.close();
  setTimeout(()=>{try{win.print();}catch(e){}},800);
  toast('Session report PDF generated','success');
}

00%"><option value="Pending"'+((existing.examStatus||'Pending')==='Pending'?' selected':'')+'>Pending</option><option value="Conducted"'+(existing.examStatus==='Conducted'?' selected':'')+'>Conducted</option><option value="Not Conducted"'+(existing.examStatus==='Not Conducted'?' selected':'')+'>Not Conducted</option><option value="Postponed"'+(existing.examStatus==='Postponed'?' selected':'')+'>Postponed</option></select></div></div><div class="fg" style="margin-bottom:0;margin-top:6px"><label>Remarks</label><input data-rex-subject="'+esc(s.subject)+'" data-rex-field="remarks" value="'+esc(existing.remarks||'')+'" placeholder="e.g. Student passed, absent again…" oninput="updRexSubField(this)"></div></div>';

function rexStuSearch(q){
  const d=document.getElementById('rex-stu-d');if(!d)return;
  if(!q.trim()){d.style.display='none';return;}
  const ql=q.toLowerCase();
  const found=(window._rexAbsentStudents||[]).filter(s=>s.studentName.toLowerCase().includes(ql)).slice(0,8);
  if(!found.length){d.style.display='block';d.innerHTML='<div style="padding:9px 12px;font-size:11px;color:var(--tx3)">No student found with that name (in absence records).</div>';return;}
  d.style.display='block';
  d.innerHTML=found.map(s=>{
    const subjCount=Object.keys(s.subjects).length;
    return'<div class="sdi" onmousedown="pickRexStu(\''+esc(s.studentId||'').replace(/\'/g,"\\'")+'\',\''+esc(s.studentName).replace(/\'/g,"\\'")+'\')"><strong>'+esc(s.studentName)+'</strong> <span style="color:var(--tx3);font-size:10px">Gr '+esc(s.grade||'')+esc(s.section||'')+' · '+subjCount+' subject'+(subjCount!==1?'s':'')+'</span></div>';
  }).join('');
}

function pickRexStu(sid,sname){
  const stu=(window._rexAbsentStudents||[]).find(s=>(sid&&s.studentId===sid)||s.studentName===sname);
  if(!stu)return;
  window._rexEdit.studentId=stu.studentId;
  window._rexEdit.studentName=stu.studentName;
  window._rexEdit.grade=stu.grade;
  window._rexEdit.section=stu.section;
  // Initialize subjects array from absences (preserve any already-saved dates)
  const existingMap={};(window._rexEdit.subjects||[]).forEach(s=>{existingMap[s.subject]=s;});
  window._rexEdit.subjects=Object.values(stu.subjects).map(s=>{
    return existingMap[s.subject]||{subject:s.subject,examDate:'',startTime:'',endTime:'',venue:'',invigilator:'',absentDates:s.absentDates};
  });
  renderReexamForm();
}

function updRexSubField(el){
  const subj=el.dataset.rexSubject,field=el.dataset.rexField,val=el.value;
  const data=window._rexEdit;
  if(!data.subjects)data.subjects=[];
  let row=data.subjects.find(s=>s.subject===subj);
  if(!row){row={subject:subj,examDate:'',startTime:'',endTime:'',venue:'',invigilator:''};data.subjects.push(row);}
  row[field]=val;
}

function saveReexam(){
  const data=window._rexEdit;
  if(!data.studentName){toast('Pick a student first','danger');return;}
  if(!data.subjects||!data.subjects.length){toast('No subjects to schedule','danger');return;}
  // Require at least one subject to have an exam date
  const withDates=data.subjects.filter(s=>s.examDate);
  if(!withDates.length){toast('Set a re-exam date for at least one subject','danger');return;}
  data.status=document.getElementById('rex-status').value;
  data.notes=document.getElementById('rex-notes').value.trim();
  data.examSession=(document.getElementById('rex-session')||{}).value||data.examSession||'';

  const list=DB.get('reexam_schedules')||[];
  if(data.isNew){
    if(!data.examSession){toast('Please enter the examination session','danger');return;}
    list.push({id:nid('rex'),studentId:data.studentId||null,studentName:data.studentName,grade:data.grade||'',section:data.section||'',examSession:data.examSession,subjects:data.subjects,status:data.status,notes:data.notes,createdBy:CU.id,createdByName:CU.firstName+' '+CU.lastName,created:new Date().toISOString()});
    logA('Created re-exam schedule for '+data.studentName+' ('+data.subjects.length+' subjects)');
    toast('Re-exam schedule created','success');
  }else{
    const i=list.findIndex(r=>r.id===data.id);if(i>=0){list[i]={...list[i],studentName:data.studentName,grade:data.grade,section:data.section,examSession:data.examSession,subjects:data.subjects,status:data.status,notes:data.notes,updated:new Date().toISOString()};
    logA('Updated re-exam schedule for '+data.studentName);toast('Updated','success');}
  }
  DB.set('reexam_schedules',list);closeM();rReexam();
}

function delReexam(id){
  if(!confirm('Delete this re-exam schedule?'))return;
  DB.set('reexam_schedules',(DB.get('reexam_schedules')||[]).filter(r=>r.id!==id));

function saveRexStatus(id,count){
  const list=DB.get('reexam_schedules')||[];
  const i=list.findIndex(r=>r.id===id);if(i<0)return;
  for(let idx=0;idx<count;idx++){
    const stEl=document.getElementById('rex-st-'+idx);
    const rmEl=document.getElementById('rex-rm-'+idx);
    if(stEl)list[i].subjects[idx].examStatus=stEl.value;
    if(rmEl)list[i].subjects[idx].remarks=rmEl.value.trim();
  }
  const overallEl=document.getElementById('rex-overall-st');
  if(overallEl)list[i].status=overallEl.value;
  list[i].statusUpdatedBy=CU.firstName+' '+CU.lastName;
  list[i].statusUpdatedAt=new Date().toISOString();
  DB.set('reexam_schedules',list);
  logA('Updated re-exam status for '+list[i].studentName);
  toast('Status updated','success');closeM();rReexam();
}

// ═══════════════════════════════════════════════════════════
// FIREBASE SYNC LAYER
// Wraps DB.set() to push to Firebase Realtime Database.
// Subscribes to all collection changes for live multi-device sync.
// Falls back to pure localStorage if Firebase fails to load.
// ═══════════════════════════════════════════════════════════

const SYNC_KEYS = [
  'settings','accounts','students','teachers','complaints','tasks','infractions',
  'referrals','class_visits','notebook_checks','activities','activity_reports',
  'early_pickups','announcements','discipline_reports','activity_log','infraction_forms',
  'visit_forms','task_requests','exam_absents','exam_sessions','academic_calendar','attendance',
  'student_health','remedial_plans','vp_reports','warning_letters','teacher_achievements','reexam_schedules',
  'sessions','active_session_id','behaviour','duty_rosters','substitutions'
];

function isSessionScopedKey(k){
  if(!Array.isArray(window.SESSION_SCOPED_KEYS||SESSION_SCOPED_KEYS))return false;
  const scopedList=window.SESSION_SCOPED_KEYS||SESSION_SCOPED_KEYS;
  for(const sk of scopedList){if(k.startsWith(sk+'_'))return true;}
  return false;
}

function shouldSyncKey(k){return SYNC_KEYS.includes(k)||isSessionScopedKey(k);}

const AUTO_REFRESH_MAP = {
  students:['rStudents'],teachers:['rTeachers','rTeacherReports','rTeacherAchievements'],
  accounts:['rAccounts'],complaints:['rComplaints','rDash'],tasks:['rTasks','rDash'],
  infractions:['rInfractions'],referrals:['rReferrals'],class_visits:['rClassVisits','rTeacherReports'],
  notebook_checks:['rNbChecks'],activities:['rActivities'],activity_reports:['rActivityReports'],
  early_pickups:['rPickup'],announcements:['rAnnouncements','rDash'],
  discipline_reports:['rDiscipline'],activity_log:['rActLog','rDash'],
  task_requests:['rTaskReqs'],exam_absents:['rExamAbsent'],academic_calendar:['rCalendar'],
  attendance:['rAttendance'],student_health:['rStudentHealth'],remedial_plans:['rRemedial'],
  vp_reports:['rVPReports'],warning_letters:['rWarnings'],
  teacher_achievements:['rTeacherAchievements'],settings:['rSettings'],
  reexam_schedules:['rReexam'],
  duty_rosters:['rDutyRoster','rMyDuties'],substitutions:['rSubstitutions','rMyDuties'],
  sessions:['rSessions'],active_session_id:['rSessions']
};

let SYNC_ENABLED=false;
let SYNC_INITIAL_LOAD=false;
let SYNC_ECHO={};

function updateSyncStatus(connected){
  const dot=document.getElementById('syncdot'),txt=document.getElementById('synctext'),ind=document.getElementById('syncind');
  if(!dot||!txt)return;
  if(!window.__FB){dot.style.background='#9aa3b6';txt.textContent='Local';if(ind)ind.title='No cloud sync — using local storage only';return;}
  if(connected){dot.style.background='#10a169';txt.textContent='Synced';if(ind)ind.title='Connected — changes sync across all devices';}
  else{dot.style.background='#dd6b20';txt.textContent='Offline';if(ind)ind.title='Offline — changes saved locally, will sync when reconnected';}
}

function waitForFirebase(maxMs){
  return new Promise(resolve=>{
    const start=Date.now();
    const check=()=>{
      if(window.__FB&&window.__FB.db){resolve(true);}
      else if(Date.now()-start>maxMs){resolve(false);}
      else{setTimeout(check,80);}
    };
    check();
  });
}

async function syncDownAll(){
  if(!window.__FB)return false;
  const{db,ref,get}=window.__FB;
  try{
    const fbPath=getFirebaseSchoolPath();
    const rootSnap=await get(ref(db,fbPath));
    if(rootSnap.exists()){
      const all=rootSnap.val();
      Object.keys(all).forEach(k=>{
        if(shouldSyncKey(k)&&all[k]!==null&&all[k]!==undefined){
          let v=all[k];
          if(v&&typeof v==='object'&&!Array.isArray(v)){
            const keys=Object.keys(v);
            if(keys.length>0&&keys.every(kk=>/^\d+$/.test(kk))){
              const arr=[];keys.sort((a,b)=>+a-+b).forEach(kk=>arr.push(v[kk]));v=arr;
            }
          }
          // Always accept Firebase data as source of truth (last-write-wins)
          localStorage.setItem(DB._pfx+k,JSON.stringify(v));
        }
      });
      return true;
    }else{return false;}
  }catch(e){console.error('[Sync] Initial pull failed:',e);return false;}
}

async function syncUpAll(){
  if(!window.__FB)return;
  const{db,ref,set}=window.__FB;
  try{
    const data={};
    const rawGet=DB._raw_get||DB.get.bind(DB);
    SYNC_KEYS.forEach(k=>{const v=rawGet(k);if(v!==null&&v!==undefined)data[k]=v;});
    for(let i=0;i<localStorage.length;i++){
      const lkey=localStorage.key(i);
      if(!lkey||!lkey.startsWith(DB._pfx))continue;
      const k=lkey.substring(DB._pfx.length);
      if(isSessionScopedKey(k)){const v=rawGet(k);if(v!==null&&v!==undefined)data[k]=v;}
    }
    const fbPath=getFirebaseSchoolPath();
    await set(ref(db,fbPath),data);
  }catch(e){console.error('[Sync] Upload failed:',e);}
}

const FB_FAILED_KEYS=new Set();
function logFBError(k,e){
  if(FB_FAILED_KEYS.has(k))return;
  FB_FAILED_KEYS.add(k);
  console.warn('[Sync] Write failed for '+k+':',e.message);
}

if(!DB._raw_set){
  const _origDBset=DB.set.bind(DB);
  DB.set=function(k,v){
    _origDBset(k,v);
    if(!SYNC_ENABLED){
      // Retry: if Firebase is available but SYNC_ENABLED was never set, auto-enable
      if(window.__FB&&window.__FB.db&&CURRENT_SCHOOL_ID){
        console.warn('[Sync] Auto-enabling SYNC — was disabled but Firebase is ready');
        SYNC_ENABLED=true;SYNC_INITIAL_LOAD=true;
      }
    }
    if(SYNC_ENABLED&&window.__FB&&shouldSyncKey(k)){
      const{db,ref,set}=window.__FB;
      SYNC_ECHO[k]=Date.now();
      const path=getFirebaseSchoolPath()+k;
      set(ref(db,path),v).then(()=>{
        const dot=document.getElementById('syncdot');if(dot)dot.style.background='#1dcd6c';
      }).catch(e=>{
        logFBError(k,e);
        const dot=document.getElementById('syncdot');if(dot)dot.style.background='#d63838';
      });
    }
  };
}else{
  const _origRawSet=DB._raw_set;
  DB._raw_set=function(k,v){
    _origRawSet(k,v);
    if(!SYNC_ENABLED&&window.__FB&&window.__FB.db&&CURRENT_SCHOOL_ID){
      console.warn('[Sync] Auto-enabling SYNC via _raw_set');
      SYNC_ENABLED=true;SYNC_INITIAL_LOAD=true;
    }
    if(SYNC_ENABLED&&window.__FB&&shouldSyncKey(k)){
      const{db,ref,set}=window.__FB;
      SYNC_ECHO[k]=Date.now();
      const path=getFirebaseSchoolPath()+k;
      set(ref(db,path),v).then(()=>{
        const dot=document.getElementById('syncdot');if(dot)dot.style.background='#1dcd6c';
      }).catch(e=>{
        logFBError(k,e);
        const dot=document.getElementById('syncdot');if(dot)dot.style.background='#d63838';
      });
    }
  };
}

function subscribeToCollection(k){
  if(!window.__FB)return;
  const{db,ref,onValue}=window.__FB;
  const _pfx=DB._pfx;
  onValue(ref(db,getFirebaseSchoolPath()+k),(snap)=>{
    if(!SYNC_INITIAL_LOAD)return;
    if(SYNC_ECHO[k]&&Date.now()-SYNC_ECHO[k]<1500)return;
    let v=snap.val();
    // When all items are deleted, Firebase removes the node (val()===null)
    // We must write empty array to localStorage so deletions sync properly
    if(v===null||v===undefined){v=[];}
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      const keys=Object.keys(v);
      if(keys.length>0&&keys.every(kk=>/^\d+$/.test(kk))){
        const arr=[];keys.sort((a,b)=>+a-+b).forEach(kk=>arr.push(v[kk]));v=arr;
      }
    }
    // Always accept Firebase data as source of truth (last-write-wins)
    localStorage.setItem(_pfx+k,JSON.stringify(v));
    let logicalKey=k;
    if(isSessionScopedKey(k)){
      const activeSid=window.__activeSessionId||(typeof getActiveSessionId==='function'?getActiveSessionId():'default');
      const expectedSuffix='_'+activeSid;
      if(!k.endsWith(expectedSuffix))return;
      logicalKey=k.substring(0,k.length-expectedSuffix.length);
    }
    const renderers=AUTO_REFRESH_MAP[logicalKey]||[];
    const curPage='r'+(_page||'').split('_').map(p=>p.charAt(0).toUpperCase()+p.slice(1)).join('');
    if(renderers.includes(curPage)){
      try{
        const fnName=renderers.find(r=>typeof window[r]==='function');
        if(fnName){
          const dot=document.getElementById('syncdot');
          if(dot){const orig=dot.style.background;dot.style.background='#3d6ee0';setTimeout(()=>{dot.style.background=orig||'#10a169';},400);}
          window[fnName]();
        }
      }catch(e){}
    }
    if(_page==='dashboard'&&typeof rDash==='function'){try{rDash();}catch(e){}}
  });
}

// Re-sync when user selects a school (subscriptions pointed to wrong path before login)
let _fbSubscriptions=[];
async function resyncForSchool(){
  if(!window.__FB||!window.__FB.db||!CURRENT_SCHOOL_ID)return;
  console.log('[Sync] resyncForSchool: school='+CURRENT_SCHOOL_ID+', path='+getFirebaseSchoolPath());
  // Pull this school's data from Firebase
  const hadData=await syncDownAll();
  console.log('[Sync] syncDownAll returned hadData='+hadData);
  // Push local data up if Firebase is empty for this school
  const{db,ref,get}=window.__FB;
  try{
    const snap=await get(ref(db,getFirebaseSchoolPath()));
    if(!snap.exists()){
      console.log('[Sync] Firebase empty for school, pushing local data up');
      await syncUpAll();
    }
  }catch(e){console.warn('[Sync] resync check failed:',e);}
  // CRITICAL: ensure sync is enabled after school login
  SYNC_INITIAL_LOAD=true;
  SYNC_ENABLED=true;
  updateSyncStatus(true);
  console.log('[Sync] SYNC_ENABLED=true, SYNC_INITIAL_LOAD=true');
  // Re-subscribe to this school's Firebase path
  const subscribed=new Set();
  // Subscribe to non-session-scoped keys (settings, accounts, etc.)
  const _scopedKeys=(typeof SESSION_SCOPED_KEYS!=='undefined')?SESSION_SCOPED_KEYS:[];
  SYNC_KEYS.forEach(k=>{
    if(!_scopedKeys.includes(k)){
      subscribeToCollection(k);subscribed.add(k);
    }
  });
  // Proactively subscribe to session-scoped keys with active session suffix
  const sid=window.__activeSessionId||(typeof getActiveSessionId==='function'?getActiveSessionId():'default');
  _scopedKeys.forEach(k=>{
    const sessionKey=k+'_'+sid;
    subscribeToCollection(sessionKey);subscribed.add(sessionKey);
  });
  // Also subscribe to any other session-scoped keys found in localStorage
  for(let i=0;i<localStorage.length;i++){
    const lkey=localStorage.key(i);
    if(!lkey||!lkey.startsWith(DB._pfx))continue;
    const k=lkey.substring(DB._pfx.length);
    if(isSessionScopedKey(k)&&!subscribed.has(k)){subscribeToCollection(k);subscribed.add(k);}
  }
  console.log('[Sync] Subscribed to '+subscribed.size+' keys for school '+CURRENT_SCHOOL_ID);
}

async function bootFirebaseSync(){
  updateSyncStatus(false);
  const ok=await waitForFirebase(8000);
  if(!ok){
    updateSyncStatus(false);
    console.warn('[Sync] Firebase not ready after 8s — will retry on login');
    if(!window.__seedDone){window.__doSeedAndStart();window.__seedDone=true;}
    // Retry in background — Firebase module might load late
    setTimeout(async()=>{
      if(!SYNC_ENABLED&&window.__FB&&window.__FB.db){
        console.log('[Sync] Late Firebase retry triggered');
        await syncPlatformFromFirebase();
        SYNC_INITIAL_LOAD=true;SYNC_ENABLED=true;
        updateSyncStatus(true);
      }
    },5000);
    return;
  }
  // Pull platform data (schools list, admins) from Firebase FIRST
  const hadPlatformData=await syncPlatformFromFirebase();
  // Only push local platform data if Firebase had NOTHING (first-ever boot)
  // Never overwrite Firebase with stale local data
  if(!hadPlatformData){
    const localSchools=getPlatformSchools();
    const localAdmins=getPlatformAdmins();
    if(localSchools.length>0){syncPlatformToFirebase('platform_schools',localSchools);}
    if(localAdmins.length>0){syncPlatformToFirebase('platform_admins',localAdmins);}
  }
  // Await __doSeedAndStart so session is restored (CURRENT_SCHOOL_ID set) before subscriptions
  if(!window.__seedDone){await window.__doSeedAndStart();window.__seedDone=true;}
  // Re-read school path after session restore
  const hadData=await syncDownAll();
  console.log('[Sync] Boot: hadData='+hadData+', school='+CURRENT_SCHOOL_ID+', path='+getFirebaseSchoolPath());
  SYNC_INITIAL_LOAD=true;
  SYNC_ENABLED=true;
  // Only push data up if we have a school context — don't push to data/ blindly
  if(!hadData&&CURRENT_SCHOOL_ID)await syncUpAll();
  // Subscribe to non-session-scoped keys
  const subscribed=new Set();
  const _bScopedKeys=(typeof SESSION_SCOPED_KEYS!=='undefined')?SESSION_SCOPED_KEYS:[];
  SYNC_KEYS.forEach(k=>{
    if(!_bScopedKeys.includes(k)){
      subscribeToCollection(k);subscribed.add(k);
    }
  });
  // Proactively subscribe to session-scoped keys with active session suffix
  const bSid=window.__activeSessionId||(typeof getActiveSessionId==='function'?getActiveSessionId():'default');
  _bScopedKeys.forEach(k=>{
    const sessionKey=k+'_'+bSid;
    subscribeToCollection(sessionKey);subscribed.add(sessionKey);
  });
  // Also subscribe to any other session-scoped keys found in localStorage
  for(let i=0;i<localStorage.length;i++){
    const lkey=localStorage.key(i);
    if(!lkey||!lkey.startsWith(DB._pfx))continue;
    const k=lkey.substring(DB._pfx.length);
    if(isSessionScopedKey(k)&&!subscribed.has(k)){subscribeToCollection(k);subscribed.add(k);}
  }
  console.log('[Sync] Boot complete: SYNC_ENABLED=true, subscribed='+subscribed.size+' keys');
  updateSyncStatus(true);
  // Subscribe to platform-level changes (schools added/removed from other devices)
  subscribePlatformSync();
  if(typeof navigate==='function'&&_page){try{navigate(_page);}catch(e){}}
}

function addActM(){openM('<div class="mh"><h3>🏃 Add Activity</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>Title *</label><input id="at"></div><div class="fg"><label>'+T('description')+'</label><textarea id="ad"></textarea></div><div class="fr f2"><div class="fg"><label>'+T('date')+' *</label><input type="date" id="adt"></div><div class="fg"><label>'+T('status')+'</label><select id="ast"><option>Upcoming</option><option>Ongoing</option><option>Completed</option><option>Cancelled</option></select></div></div><div class="fr f2"><div class="fg"><label>Venue</label><input id="av"></div><div class="fg"><label>Participants</label><input id="ap"></div></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveAct()">'+T('save')+' →</button></div>');}
function saveAct(){const t=document.getElementById('at').value.trim(),d=document.getElementById('adt').value;if(!t||!d){toast('Title and date required','danger');return;}const acts=DB.get('activities')||[];acts.push({id:nid('a'),title:t,description:document.getElementById('ad').value,date:d,status:document.getElementById('ast').value,venue:document.getElementById('av').value,participants:document.getElementById('ap').value,inchargeId:CU.id,inchargeName:CU.firstName+' '+CU.lastName,updates:[],created:new Date().toISOString().split('T')[0]});DB.set('activities',acts);logA('Added activity: '+t);closeM();toast('Added','success');rActivities();}
function manAct(id){const acts=DB.get('activities')||[];const a=acts.find(x=>x.id===id);if(!a)return;const canE=a.inchargeId===CU.id||['superadmin','principal','vice_principal'].includes(CU.role);openM('<div class="mh"><h3>'+a.title+'</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="cg g2" style="margin-bottom:12px;font-size:12px"><div><div style="font-size:10px;color:var(--tx3)">'+T('date')+'</div><div style="font-weight:600">'+a.date+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Status</div><span class="badge bbl">'+a.status+'</span></div></div>'+(canE?'<div class="fg"><label>'+T('status')+'</label><select id="ast2">'+['Upcoming','Ongoing','Completed','Cancelled'].map(s=>'<option'+(a.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="fg"><label>Add Update</label><textarea id="aupd"></textarea></div>':'')+((a.updates||[]).length?'<div style="margin-top:10px"><div style="font-size:10px;font-weight:700;text-transform:uppercase;color:var(--tx3);margin-bottom:7px">Updates</div><div class="tl2">'+a.updates.map(u=>'<div class="tli"><div class="tld"></div><div class="tlm">'+u.time+'</div><div class="tlc">'+u.text+'</div></div>').join('')+'</div></div>':'')+'</div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('close')+'</button>'+(canE?'<button class="btn bp" onclick="saveActUp(\''+id+'\')">'+T('save')+' →</button>':'')+'</div>');}
function saveActUp(id){const acts=DB.get('activities')||[];const i=acts.findIndex(a=>a.id===id);if(i<0)return;acts[i].status=document.getElementById('ast2').value;const upd=document.getElementById('aupd').value.trim();if(upd){acts[i].updates=acts[i].updates||[];acts[i].updates.push({text:upd,time:new Date().toLocaleString()});logA('Updated activity "'+acts[i].title+'"');}DB.set('activities',acts);closeM();toast('Updated','success');rActivities();}
function rPickup(){const pus=DB.get('early_pickups')||[];const sb={Pending:'bgo',Approved:'bgn',Rejected:'brd','Student Released':'btl'};document.getElementById('pc').innerHTML='<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:5px;flex-wrap:wrap">'+['All','Pending','Approved','Student Released'].map(s=>'<button class="btn '+(s==='All'?'bp':'bg2')+' bsm puf" onclick="fltPu(\''+s+'\',this)">'+s+(s==='Pending'?' ('+pus.filter(p=>p.status==='Pending').length+')':'')+'</button>').join('')+'</div></div><div id="puw" class="card">'+bPuTbl(pus,sb)+'</div>';window.fltPu=function(s,el){document.querySelectorAll('.puf').forEach(b=>{b.className=b.className.replace('bp','bg2');});el.className=el.className.replace('bg2','bp');document.getElementById('puw').innerHTML=bPuTbl(s==='All'?pus:pus.filter(p=>p.status===s),sb);};}
function bPuTbl(list,sb){if(!list.length)return'<div class="emp"><div class="ei">🚗</div><p>'+T('no_records')+'</p></div>';return'<div class="tw"><table><thead><tr><th>Student</th><th>'+T('grade')+'</th><th>'+T('guardian')+'</th><th>'+T('reason')+'</th><th>Time</th><th>'+T('status')+'</th><th>'+T('date')+'</th><th>Actions</th></tr></thead><tbody>'+list.map(p=>{const showQR=(p.status==='Approved'||p.status==='Student Released');return'<tr><td><strong>'+p.studentName+'</strong></td><td>'+p.grade+'</td><td>'+p.guardianName+'<br><span class="mono" style="font-size:10px;color:var(--tx3)">'+p.guardianPhone+'</span></td><td style="font-size:11px">'+p.reason+'</td><td class="mono" style="font-size:11px">'+p.pickupTime+'</td><td><span class="badge '+(sb[p.status]||'bgr')+'">'+p.status+'</span>'+(p.qrIssuedAt?'<br><span style="font-size:9px;color:var(--gd)">📱 QR issued</span>':'')+'</td><td style="font-size:10px;color:var(--tx3)">'+(p.created||'').split('T')[0]+'</td><td style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn bg2 bxs" onclick="manPu(\''+p.id+'\')">Manage</button>'+(showQR?'<button class="btn bo bxs" onclick="viewPickupQR(\''+p.id+'\')" title="Generate / view QR slip">📱 QR</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';}
function manPu(id){const pus=DB.get('early_pickups')||[];const p=pus.find(x=>x.id===id);if(!p)return;const canA=['admin_assistant','superadmin','principal','vice_principal'].includes(CU.role);const showQR=(p.status==='Approved'||p.status==='Student Released');const pickedByLabel=p.pickedBy?(p.pickedBy==='Father'||p.pickedBy==='Mother'?p.pickedBy:p.pickedBy+(p.pickedByName?' — '+p.pickedByName:'')):'—';openM('<div class="mh"><h3>🚗 Early Pickup — '+p.studentName+'</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="cg g2" style="margin-bottom:12px;font-size:12px"><div><div style="font-size:10px;color:var(--tx3)">Student</div><div style="font-weight:600">'+p.studentName+'</div><div style="font-size:11px;color:var(--tx3)">'+p.grade+'</div></div><div><div style="font-size:10px;color:var(--tx3)">'+T('guardian')+'</div><div style="font-weight:600">'+p.guardianName+'</div><div class="mono" style="font-size:11px;color:var(--tx3)">'+p.guardianPhone+'</div></div><div><div style="font-size:10px;color:var(--tx3)">'+T('reason')+'</div><div style="font-weight:600">'+p.reason+'</div></div><div><div style="font-size:10px;color:var(--tx3)">Pickup Time</div><div class="mono" style="font-weight:600">'+p.pickupTime+'</div></div></div>'+(p.pickedBy?'<div class="al ai" style="margin-bottom:12px"><div style="font-size:10px;color:var(--tx3);text-transform:uppercase;font-weight:700;margin-bottom:3px">👤 Will Be Picked Up By</div><div style="font-size:13px;font-weight:600">'+esc(pickedByLabel)+'</div>'+(p.pickedByPhone?'<div class="mono" style="font-size:11px;margin-top:2px">📞 '+esc(p.pickedByPhone)+'</div>':'')+(p.pickedById?'<div style="font-size:11px;margin-top:2px">🆔 ID: '+esc(p.pickedById)+'</div>':'')+'</div>':'')+(p.notes?'<div class="fg"><label>Parent Note</label><div style="background:var(--sf2);padding:10px;border-radius:var(--rs);font-size:12px;color:var(--tx2)">'+p.notes+'</div></div>':'')+(canA?'<div class="fg"><label>'+T('status')+'</label><select id="pust">'+['Pending','Approved','Rejected','Student Released'].map(s=>'<option'+(p.status===s?' selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="fg"><label>Staff Note</label><textarea id="punt">'+(p.staffNotes||'')+'</textarea></div>':'')+(p.staffNotes&&!canA?'<div class="al ag">Staff: '+p.staffNotes+'</div>':'')+(showQR?'<div class="al ag" style="margin-bottom:0">📱 This pickup is <strong>'+p.status+'</strong>. Click "Generate QR Slip" below to print/share with the gate guard.</div>':'')+'</div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('close')+'</button>'+(showQR?'<button class="btn bo bsm" onclick="closeM();viewPickupQR(\''+id+'\')">📱 Generate QR Slip</button>':'')+(canA?'<button class="btn bp" onclick="savePu(\''+id+'\')">'+T('save')+' →</button>':'')+'</div>');}
function savePu(id){const pus=DB.get('early_pickups')||[];const i=pus.findIndex(p=>p.id===id);if(i<0)return;const oldStatus=pus[i].status;pus[i].status=document.getElementById('pust').value;pus[i].staffNotes=document.getElementById('punt').value;pus[i].handledBy=CU.firstName+' '+CU.lastName;DB.set('early_pickups',pus);logA('Updated early pickup for '+pus[i].studentName+' → '+pus[i].status);closeM();toast('Updated','success');rPickup();const newStatus=pus[i].status;const p=pus[i];if(oldStatus!==newStatus&&(newStatus==='Approved'||newStatus==='Student Released')){setTimeout(()=>{notifyParentRelease(id);},250);}}

// addAbsM: session-aware absent form. If sessionName given, pre-fills it (locked). Otherwise, shows dropdown of sessions.
function addAbsM(sessionName){
  const sessions=DB.get('exam_sessions')||[];
  const activeSessions=sessions.filter(s=>s.status==='active');
  if(!sessionName&&!activeSessions.length){toast('Please create an exam session first','danger');addExamSessionM();return;}
  const sessOpts=activeSessions.map(s=>'<option value="'+esc(s.name)+'"'+(sessionName&&s.name===sessionName?' selected':'')+'>'+esc(s.name)+'</option>').join('');
  const sessField=sessionName?'<input id="abs-session" value="'+esc(sessionName)+'" readonly style="background:var(--sf2);cursor:not-allowed">':'<select id="abs-session" style="width:100%;padding:9px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:13px"><option value="">— Select Session —</option>'+sessOpts+'</select>';
  openM('<div class="mh"><h3>📵 Add Exam Absent</h3><button class="mc" onclick="closeM()">×</button></div><div class="mb2"><div class="fg"><label>Exam Session *</label>'+sessField+'</div><div class="fg"><label>Student * (search by name)</label>'+sw('pickAbsStu','abssi','abssd')+'</div><div id="absss" style="display:none" class="al ai"></div><input type="hidden" id="abssid"><div class="fr f2"><div class="fg"><label>'+T('exam_subject')+' *</label><input id="abss" placeholder="e.g. Mathematics"></div><div class="fg"><label>'+T('absent_date')+' *</label><input type="date" id="absdt" value="'+new Date().toISOString().split('T')[0]+'"></div></div><div class="fg"><label>'+T('remarks')+'</label><textarea id="absrm"></textarea></div></div><div class="mf"><button class="btn bg2" onclick="closeM()">'+T('cancel')+'</button><button class="btn bp" onclick="saveAbs()">Add →</button></div>');window.pickAbsStu=function(sid){const s=gS(sid);document.getElementById('abssid').value=sid;document.getElementById('abssi').value=fN(s);document.getElementById('abssd').style.display='none';document.getElementById('absss').style.display='block';document.getElementById('absss').textContent='✓ '+fN(s)+' — Gr '+s.grade+'-'+s.section;};
}
function saveAbs(){const sid=document.getElementById('abssid').value,subj=document.getElementById('abss').value.trim(),dt=document.getElementById('absdt').value,session=(document.getElementById('abs-session')||{}).value||'';if(!session.trim()){toast('Please select an exam session','danger');return;}if(!sid||!subj||!dt){toast('Fill required fields','danger');return;}const s=gS(sid),abs=DB.get('exam_absents')||[];abs.push({id:nid('abs'),studentId:sid,studentName:fN(s),grade:s.grade,section:s.section,subject:subj,absentDate:dt,examSession:session.trim(),remarks:document.getElementById('absrm').value,addedBy:CU.firstName+' '+CU.lastName,created:new Date().toISOString()});DB.set('exam_absents',abs);logA('Exam absent: '+fN(s)+' — '+subj+' ('+session.trim()+')');closeM();toast('Added','success');rExamAbsent();}

function expAbsC(){const l=DB.get('exam_absents')||[];expCSV(['Student','Grade','Section','Exam Session','Subject','Absent Date','Remarks','Added By'],l.map(a=>[a.studentName,a.grade,a.section||'',a.examSession||'',a.subject,a.absentDate,a.remarks||'',a.addedBy]),'exam_absents_'+new Date().toISOString().split('T')[0]);}
function expAbsP(){const l=DB.get('exam_absents')||[];expPDF('Exam Absent List',['Student','Grade','Section','Exam Session','Subject','Date','Remarks','Added By'],l.map(a=>[a.studentName,a.grade,a.section||'',a.examSession||'',a.subject,a.absentDate,a.remarks||'',a.addedBy]));}
function rAnnouncements(){const anns=DB.get('announcements')||[];const canP=['superadmin','principal','vice_principal','activity_incharge'].includes(CU.role);document.getElementById('pc').innerHTML='<div class="card" style="margin-bottom:12px"><div class="sh2"><h3>'+T('announcements')+'</h3>'+(canP?'<button class="btn bp bsm" onclick="addAnnM()">+</button>':'')+'</div></div>'+anns.slice().reverse().map(a=>'<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><div><div style="font-weight:600;margin-bottom:3px">📢 '+a.title+'</div><div style="font-size:12px;color:var(--tx2);margin-bottom:5px;line-height:1.5">'+a.body+'</div><div style="font-size:10px;color:var(--tx3)">'+a.date+' · '+a.postedBy+'</div></div>'+(canP?'<button class="btn bg2 bxs" onclick="delAnn(\''+a.id+'\')">Del</button>':'')+'</div></div>').join('')||'<div class="card"><div class="emp"><div class="ei">📢</div><p>'+T('no_records')+'</p></div></div>';}

function doExp(fmt){

  if(staffF&&type==='tasks')data=data.filter(t=>t.assignedTo===staffF||t.assignedBy===staffF);
  const cfg={complaints:{h:['Track No','Parent','Phone','Student','Grade','Type','Subtype','Status','Priority','Assigned To','Date'],r:d=>[d.trackNo,d.parentName,d.parentPhone,d.studentName,d.grade+'-'+d.section,d.type,d.subtype,d.status,d.priority,d.assignedName||'Unassigned',(d.created||'').split('T')[0]]},tasks:{h:['Title','Description','Assigned To','Assigned By','Status','Priority','Progress','Due Date'],r:d=>[d.title,d.desc,d.assignedName,d.assignedByName,d.status,d.priority,d.progress+'%',d.dueDate]},infractions:{h:['Student','Grade','Degree','Occurrence','Violation','Procedure','Points Deducted','Description','Guardian Contact','Follow-up Status','Notes','Date','Recorded By','Principal Ack'],r:d=>[d.studentName,d.grade+'-'+d.section,d.degree,d.occurrence||'',d.type,d.procedure||'',d.pointsDeducted||0,d.description,d.guardianContact||'',d.followUpStatus||'',d.actionTaken||'',d.date,d.createdByName,d.principalAck||'']},referrals:{h:['Student','Grade','Reason','From','To','Status','Date'],r:d=>[d.studentName,d.grade+'-'+d.section,d.reason,d.referredByName,d.referredToName,d.status,d.created]},early_pickups:{h:['Student','Grade','Guardian','Phone','Reason','Pickup Time','Status','Date'],r:d=>[d.studentName,d.grade,d.guardianName,d.guardianPhone,d.reason,d.pickupTime,d.status,(d.created||'').split('T')[0]]},exam_absents:{h:['Student','Grade','Section','Exam Session','Subject','Absent Date','Remarks','Added By'],r:d=>[d.studentName,d.grade,d.section||'',d.examSession||'',d.subject,d.absentDate,d.remarks||'',d.addedBy]},class_visits:{h:['Teacher','Subject','Grade','Date','Rating','Supervisor','Academic Ack','Principal Ack'],r:d=>[d.teacher,d.subject,d.grade+'-'+d.section,d.date,d.rating,d.supervisorName,d.academicAckDate||'',d.principalAckDate||'']},notebook_checks:{h:['Student','Grade','Subject','Notebook','Workbook','Tchr Check','Date'],r:d=>[d.studentName,d.grade+'-'+d.section,d.subject,d.notebookStatus,d.workbookStatus,d.teacherChecking,d.date]},discipline_reports:{h:['Title','Grade','Teacher','Date','Created By','Principal Ack'],r:d=>[d.title,d.grade+'-'+d.section,d.teacher||'',d.date,d.createdByName,d.principalAck||'']},activity_reports:{h:['Activity Name','Teacher Conducted','Activity Date','Submitted By','Submitted On','Additional Note'],r:d=>[d.activityName,d.teacher,d.activityDate,d.createdByName,(d.created||'').split('T')[0],d.additionalNote||'']}}[type];
  if(!cfg){toast('Config not found','danger');return;}
  const rows=data.map(cfg.r);const title=type.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+' Report';const fn=type+'_'+new Date().toISOString().split('T')[0];
  if(fmt==='csv')expCSV(cfg.h,rows,fn);else expPDF(title,cfg.h,rows);
}

// Boot: detect parent-portal URL parameters EARLY so users scanning a QR
// see the public form immediately instead of the admin login flash.
// Note: we still let seed()/migrate() run so DB has settings (school name, logo).
(function(){
  try{
    const p=new URLSearchParams(window.location.search);
    if(p.get('parent')==='1'){window.__earlyPortal='parent';}
    else if(p.get('pickup')==='1'){window.__earlyPortal='pickup';}
  }catch(e){}
})();

window.__doSeedAndStart=async function(){
  // Initialize platform (multi-school registry)
  await initPlatform();
  populateSchoolDropdown();
  // If a school was previously selected in this session, restore it
  const savedSchool=localStorage.getItem('sms7_current_school');
  if(savedSchool){selectSchool(savedSchool);}
  // Initialize sessions FIRST so DB.get/set is wrapped before any seed runs
  if(typeof initSessions==='function')initSessions();
  seed();
  migrate();
  // Render the right UI based on URL
  if(window.__earlyPortal==='parent'&&typeof checkParentMode==='function'){
    checkParentMode();
  }else if(window.__earlyPortal==='pickup'&&typeof checkPickupMode==='function'){
    checkPickupMode();
  }else if(checkParentMode()){
    // legacy detection in case the URL flag was added differently
  }else if(typeof checkPickupMode==='function'&&checkPickupMode()){
    // legacy detection
  }else{
    // Restore login session if user was previously logged in
    try{
      const sess=JSON.parse(localStorage.getItem('sms7_session')||'null');
      if(sess&&sess.userId&&sess.school){
        if(sess.school==='__platform'){
          const admins=getPlatformAdmins();
          const admin=admins.find(a=>a.id===sess.userId&&a.active);
          if(admin){
            CU={...admin,role:'platform_admin',_origRole:'platform_admin'};
            PLATFORM_MODE=true;CURRENT_SCHOOL_ID=null;SAIMP=false;SAR=null;
            console.log('[Session] Restored platform admin session');
            launchPlatform();
          }
        }else{
          selectSchool(sess.school);
          if(typeof resyncForSchool==='function')await resyncForSchool();
          const acc=DB.get('accounts')||[];
          const user=acc.find(a=>a.id===sess.userId&&a.active);
          if(user){
            CU=user;SAIMP=false;SAR=null;
            console.log('[Session] Restored school session: '+user.username+' @ '+sess.school);
            launch();
          }
        }
      }
    }catch(e){console.warn('[Session] Restore failed:',e);}
  }
  // After login screen renders, refresh session indicator
  if(typeof renderSessionIndicator==='function')setTimeout(renderSessionIndicator,500);
};
// Boot: Firebase sync will call __doSeedAndStart after pulling cloud data.
// Fallback to local-only if Firebase doesn't load within 12s (gives bootFirebaseSync enough time).
if(typeof window.__FB!=='undefined'||document.querySelector('script[type="module"]')){
  setTimeout(()=>{if(!window.__seedDone){console.warn('[Boot] Fallback — starting without full sync');window.__doSeedAndStart();window.__seedDone=true;}},12000);
}else{
  window.__doSeedAndStart();
  window.__seedDone=true;
}

function checkPickupMode(){

  document.body.classList.add('parent-mode');
  const lp=document.getElementById('lp');if(lp)lp.classList.add('hidden');
  const app=document.getElementById('app');if(app)app.classList.add('hidden');
  let pp=document.getElementById('parent-portal');
  if(!pp){pp=document.createElement('div');pp.id='parent-portal';pp.style.cssText='min-height:100vh;background:var(--bg);padding:20px;display:flex;justify-content:center;align-items:flex-start';document.body.appendChild(pp);}

  renderPickupRequestForm();

function onPickedByChange(){
  const v=document.getElementById('pup-pickedby').value;
  const other=document.getElementById('pup-pickedby-other');
  if(!other)return;
  // Show "name + phone + id" fields whenever the relationship isn't blank — guardian needs to specify the actual person
  // For "Father"/"Mother" though, we can assume it's the same person filling the form (the guardian themselves)
  // Show extra fields for everyone else, mandatory for "Other"
  if(v&&v!=='Father'&&v!=='Mother'){
    other.style.display='block';
  }else{
    other.style.display='none';
  }
}

function submitPickupRequest(){
  const sn=document.getElementById('pup-sn').value.trim();
  const gr=document.getElementById('pup-gr').value.trim();
  const gn=document.getElementById('pup-gn').value.trim();
  const gp=document.getElementById('pup-gp').value.trim();
  const pickedBy=document.getElementById('pup-pickedby').value;
  const pickedByName=document.getElementById('pup-pickedby-name')?document.getElementById('pup-pickedby-name').value.trim():'';
  const pickedByPhone=document.getElementById('pup-pickedby-phone')?document.getElementById('pup-pickedby-phone').value.trim():'';
  const pickedById=document.getElementById('pup-pickedby-id')?document.getElementById('pup-pickedby-id').value.trim():'';
  const reason=document.getElementById('pup-reason').value;
  const time=document.getElementById('pup-time').value;
  const notes=document.getElementById('pup-notes').value.trim();
  if(!sn||!gn||!gp||!pickedBy||!reason||!time){alert('Please fill all required fields including who will pick up the student');return;}
  // If "Other" is selected, the name field is required
  if(pickedBy!=='Father'&&pickedBy!=='Mother'&&!pickedByName){alert('Please enter the name of the person who will pick up the student');return;}
  // Generate tracking number
  const trackNo='PU-'+Date.now().toString(36).toUpperCase().slice(-7);
  const list=DB.get('early_pickups')||[];
  const id='pu'+Date.now();
  list.push({id,trackNo,studentName:sn,grade:gr||'—',guardianName:gn,guardianPhone:gp,pickedBy,pickedByName:pickedByName||(pickedBy==='Father'||pickedBy==='Mother'?gn:''),pickedByPhone:pickedByPhone||(pickedBy==='Father'||pickedBy==='Mother'?gp:''),pickedById,reason,pickupTime:time,notes,status:'Pending',source:'parent_qr',submittedAt:new Date().toISOString(),created:new Date().toISOString()});
  DB.set('early_pickups',list);
  // Show success page
  const c=document.getElementById('pup-content');
  c.innerHTML='<div style="text-align:center;padding:18px 8px"><div style="font-size:54px;margin-bottom:9px">✅</div><h2 style="font-size:19px;color:var(--tx);margin-bottom:9px">Request Submitted</h2><p style="font-size:12px;color:var(--tx2);margin-bottom:16px;line-height:1.6">Your early pickup request for <strong>'+esc(sn)+'</strong> has been received. Please show the tracking number below to the school admin office. Once approved, you will receive a QR code to show the gate guard.</p>'
  +'<div style="background:var(--ac2);border:2px solid var(--ac);border-radius:10px;padding:16px;margin-bottom:18px"><div style="font-size:10px;color:var(--ac);text-transform:uppercase;font-weight:700;margin-bottom:5px">Tracking Number</div><div class="mono" style="font-size:24px;font-weight:bold;color:var(--ac);letter-spacing:1px">'+trackNo+'</div><div style="font-size:10px;color:var(--tx3);margin-top:5px">Save this — you may need it</div></div>'
  +'<div style="background:var(--sf2);border-radius:8px;padding:11px 13px;font-size:11px;color:var(--tx2);text-align:left;line-height:1.7;margin-bottom:13px"><strong>Pickup will be done by:</strong><br>👤 '+esc(pickedBy==='Father'||pickedBy==='Mother'?(pickedBy+' ('+gn+')'):(pickedBy+' — '+pickedByName))+(pickedByPhone?'<br>📞 '+esc(pickedByPhone):'')+'</div>'
  +'<div style="background:var(--sf2);border-radius:8px;padding:11px 13px;font-size:11px;color:var(--tx2);text-align:left;line-height:1.7;margin-bottom:13px"><strong>What happens next:</strong><br>1. School staff will review your request<br>2. They will verify with you (may call '+esc(gp)+')<br>3. Once approved, the office will give you a QR code<br>4. Show that QR to the gate guard for the student to be released</div>'
  +'<button class="btn bp" style="width:100%;justify-content:center;padding:11px" onclick="renderPickupRequestForm()">+ Submit Another Request</button></div>';
}

function rPickup(){
  const canV=['admin_assistant','superadmin','principal','vice_principal','student_advisor'].includes(CU.role);
  if(!canV){document.getElementById('pc').innerHTML='<div class="emp"><div class="ei">🔒</div><p>Access restricted</p></div>';return;}
  
  const pus=DB.get('early_pickups')||[];
  const today=new Date().toISOString().split('T')[0];
  const todayCount=pus.filter(p=>(p.created||'').startsWith(today)).length;
  const pendingCount=pus.filter(p=>p.status==='Pending').length;
  const approvedCount=pus.filter(p=>p.status==='Approved').length;
  const releasedCount=pus.filter(p=>p.status==='Student Released').length;

  +'<div class="cg g4" style="margin-bottom:13px"><div class="stat go"><div class="sl2">Pending Review</div><div class="sv">'+pendingCount+'</div><div class="sic">⏳</div></div><div class="stat gn"><div class="sl2">Approved</div><div class="sv">'+approvedCount+'</div><div class="sic">✓</div></div><div class="stat tl"><div class="sl2">Released</div><div class="sv">'+releasedCount+'</div><div class="sic">🚪</div></div><div class="stat bl"><div class="sl2">Today</div><div class="sv">'+todayCount+'</div><div class="sb3">'+today+'</div><div class="sic">📅</div></div></div>'
  +'<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="puq" placeholder="🔍 Search by student, guardian, tracking number, or phone…" oninput="fltPu2()" style="flex:1;min-width:230px;padding:9px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:13px"><input type="date" id="pud" onchange="fltPu2()" style="padding:9px 11px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:13px"><button class="btn bg2 bsm" onclick="document.getElementById(\'pud\').value=\''+today+'\';fltPu2()">Today</button><button class="btn bg2 bsm" onclick="document.getElementById(\'pud\').value=\'\';fltPu2()">All Dates</button></div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">'+['All','Pending','Approved','Student Released','Rejected'].map((s,i)=>{const cnt=s==='All'?pus.length:pus.filter(p=>p.status===s).length;return'<button class="btn '+(s==='All'?'bp':'bg2')+' bsm puf" onclick="fltPuStatus(\''+s+'\',this)">'+s+' <span style="background:rgba(255,255,255,0.25);padding:1px 7px;border-radius:9px;margin-left:5px;font-size:10px">'+cnt+'</span></button>';}).join('')+'</div></div>'
  +'<div id="puw" class="card">'+bPuTbl(pus)+'</div>';
  
  // Active filter state
  window._puFilter={status:'All',q:'',date:''};
  window.fltPuStatus=function(s,el){
    document.querySelectorAll('.puf').forEach(b=>{b.className=b.className.replace('bp','bg2');});
    el.className=el.className.replace('bg2','bp');
    window._puFilter.status=s;
    applyPuFilters();
  };
  window.fltPu2=function(){
    window._puFilter.q=document.getElementById('puq').value.toLowerCase().trim();
    window._puFilter.date=document.getElementById('pud').value;
    applyPuFilters();
  };
  window.applyPuFilters=function(){
    let list=DB.get('early_pickups')||[];
    const f=window._puFilter;
    if(f.status&&f.status!=='All')list=list.filter(p=>p.status===f.status);
    if(f.q)list=list.filter(p=>((p.studentName||'')+' '+(p.guardianName||'')+' '+(p.trackNo||'')+' '+(p.guardianPhone||'')+' '+(p.grade||'')).toLowerCase().includes(f.q));
    if(f.date)list=list.filter(p=>(p.created||'').startsWith(f.date));
    document.getElementById('puw').innerHTML=bPuTbl(list);
  };
}

function bPuTbl(list){
  const sb={Pending:'bgo',Approved:'bgn',Rejected:'brd','Student Released':'btl'};
  if(!list.length)return'<div class="emp"><div class="ei">🚗</div><p>'+T('no_records')+'</p><div style="font-size:11px;color:var(--tx3);margin-top:6px">Pickup requests submitted by parents via the QR portal will appear here.</div></div>';
  return'<div class="tw"><table><thead><tr><th>Track #</th><th>Student</th><th>Grade</th><th>Guardian</th><th>Picked Up By</th><th>Reason</th><th>Time</th><th>Status</th><th>Submitted</th><th>Actions</th></tr></thead><tbody>'+list.slice().reverse().map(p=>{const showQR=(p.status==='Approved'||p.status==='Student Released');const showNotify=((p.status==='Approved'||p.status==='Student Released')&&p.guardianPhone);const pickedByLabel=p.pickedBy?(p.pickedBy==='Father'||p.pickedBy==='Mother'?p.pickedBy:p.pickedBy+(p.pickedByName?'<br><span style="font-size:10px;color:var(--tx3)">'+esc(p.pickedByName)+'</span>':'')):'—';return'<tr><td><code style="font-size:10px;color:var(--ac)">'+esc(p.trackNo||p.id.slice(-6).toUpperCase())+'</code>'+(p.source==='parent_qr'?'<br><span style="font-size:9px;color:var(--gd)">📱 Parent QR</span>':'')+'</td><td><strong>'+esc(p.studentName)+'</strong></td><td>'+esc(p.grade||'—')+'</td><td>'+esc(p.guardianName||'—')+'<br><span class="mono" style="font-size:10px;color:var(--tx3)">'+esc(p.guardianPhone||'')+'</span></td><td style="font-size:11px">'+pickedByLabel+'</td><td style="font-size:11px">'+esc(p.reason||'—')+'</td><td class="mono" style="font-size:11px">'+esc(p.pickupTime||'—')+'</td><td><span class="badge '+(sb[p.status]||'bgr')+'">'+esc(p.status)+'</span>'+(p.qrIssuedAt?'<br><span style="font-size:9px;color:var(--gd)">📱 QR issued</span>':'')+(p.releaseNotifiedAt?'<br><span style="font-size:9px;color:var(--su)">📲 Parent notified</span>':'')+'</td><td style="font-size:10px;color:var(--tx3)">'+(p.created||'').split('T')[0]+'<br><span style="font-size:9px">'+((p.created||'').split('T')[1]||'').slice(0,5)+'</span></td><td style="display:flex;gap:4px;flex-wrap:wrap"><button class="btn bg2 bxs" onclick="manPu(\''+p.id+'\')">Manage</button>'+(showQR?'<button class="btn bo bxs" onclick="viewPickupQR(\''+p.id+'\')" title="Generate / view QR slip">📱 QR</button>':'')+(showNotify?'<button class="btn bs bxs" onclick="notifyParentRelease(\''+p.id+'\')" title="Notify parent via WhatsApp with QR code">📲 Notify</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';
}

// ─── PARENT NOTIFICATION via WhatsApp (Approved or Released) ─────

function notifyParentRelease(id){
  const list=DB.get('early_pickups')||[];
  const i=list.findIndex(x=>x.id===id);
  if(i<0)return;
  const p=list[i];
  if(!p.guardianPhone){toast('No guardian phone number on file','danger');return;}
  
  // Ensure QR has been issued so the URL is stable
  if(!p.qrIssuedAt){
    list[i].qrIssuedAt=new Date().toISOString();
    DB.set('early_pickups',list);
    p.qrIssuedAt=list[i].qrIssuedAt;
  }
  
  const s=DB.get('settings')||{};
  const cleanPh=cleanPhone(p.guardianPhone);
  const isReleased=(p.status==='Student Released');
  // The actual QR image URL (large size for download)

// Always opens WhatsApp at the parent's specific number using wa.me/<phone>?text=...
// This is the ONLY URL format that targets a specific contact directly.
function sendReleaseWA(id){
  const msg=document.getElementById('rel-msg').value.trim();
  if(!msg){toast('Message cannot be empty','danger');return;}
  const phone=window._relPhone;
  if(!phone){toast('Phone number missing — cannot send','danger');return;}
  const qrUrl=window._relQRImgUrl;
  const fname='pickup_QR_'+window._relTrackNo+'.png';
  
  // CRITICAL: Open WhatsApp FIRST inside the user-gesture click handler.
  // Some browsers block `window.open()` if it follows a download trigger.
  const url='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
  // window.open with _blank works on both mobile and desktop — opens WhatsApp app on mobile via the redirect, and a new tab on desktop. 
  // We do NOT use window.location.href because it would replace the admin app and confuse users.
  const waWindow=window.open(url,'_blank','noopener,noreferrer');
  if(!waWindow){
    // popup blocked — fall back to programmatic anchor click which is harder to block
    const link=document.createElement('a');
    link.href=url;
    link.target='_blank';
    link.rel='noopener noreferrer';
    document.body.appendChild(link);
    link.click();
    setTimeout(()=>{try{document.body.removeChild(link);}catch(e){}},200);
  }
  
  // Now trigger the QR download AFTER the WhatsApp tab has been spawned
  setTimeout(()=>{
    const a=document.createElement('a');
    a.href=qrUrl;
    a.download=fname;
    a.target='_blank';
    a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{try{document.body.removeChild(a);}catch(e){}},200);
  },300);
  
  closeM();
  toast('WhatsApp chat opened with parent · QR downloading. Attach with 📎 in WhatsApp.','success');
  rPickup();
}

// Helper: find the teacher record matching the current user
function getMyTeacherRecord(){
  if(CU.role!=='teacher')return null;
  const teachers=DB.get('teachers')||[];
  // Match by linked teacherId on account, or by full name
  if(CU.teacherId){
    const found=teachers.find(t=>t.id===CU.teacherId);
    if(found)return found;
  }
  // Fallback: match by full name
  const fullName=(CU.firstName+' '+CU.lastName).trim().toLowerCase();
  return teachers.find(t=>{
    const tName=((t.firstName||'')+' '+(t.lastName||'')).trim().toLowerCase();
    return tName===fullName;
  })||null;
}

// Helper: get records linked to this teacher (by name or by teacherId field on records)
function getMyTeacherLinkedRecords(collection,fieldNames){
  const me=getMyTeacherRecord();
  const list=DB.get(collection)||[];
  const myFullName=((CU.firstName||'')+' '+(CU.lastName||'')).trim().toLowerCase();
  return list.filter(r=>{
    for(const f of fieldNames){
      const v=r[f];
      if(!v)continue;
      // If the field stores an ID and matches our teacher record id
      if(me&&v===me.id)return true;
      // If the field stores a name string
      if(typeof v==='string'&&v.trim().toLowerCase()===myFullName)return true;
      if(typeof v==='string'&&me&&v.trim().toLowerCase()===((me.firstName||'')+' '+(me.lastName||'')).trim().toLowerCase())return true;
    }
    return false;
  });
}

function getMyWarningLetters(){
  // Match warning letters issued to the current user by:
  // 1. recipientId === CU.id (account ID — when issued via "staff" category)
  // 2. recipientId === teacher record ID (when issued via "teacher" category)
  // 3. recipientName matches CU full name (fallback)
  const list=DB.get('warning_letters')||[];
  const myFullName=((CU.firstName||'')+' '+(CU.lastName||'')).trim().toLowerCase();
  const me=(CU.role==='teacher')?getMyTeacherRecord():null;
  return list.filter(w=>{
    if(w.recipientId&&w.recipientId===CU.id)return true;
    if(me&&w.recipientId&&w.recipientId===me.id)return true;
    const rn=(w.recipientName||'').trim().toLowerCase();
    if(rn&&rn===myFullName)return true;
    return false;
  });
}
